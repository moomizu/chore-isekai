<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chore Isekai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: full-screen gacha home. Guild hall scene + Lilia behind the counter; HUD on top, ornate nav at bottom; other screens are gold-framed panels over the dimmed hall. */
  --night:rgba(12,20,50,.92);
  --gold:#f3cb64;
  --gold-dk:#a8771f;
  --cream:#fff5d8;
  --blue:#2f63e6;
  --rose:#ff6f91;
  --paper:#f4e4bd;
  --ink:#3b2412;
  --display:"Cinzel","Times New Roman",serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#1a0f08;color:var(--cream);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.app{position:fixed;inset:0;max-width:560px;margin:0 auto;overflow:hidden}

/* ---------- scene ---------- */
.scene,.scene svg,#fx{position:absolute;inset:0;width:100%;height:100%}
#fx{pointer-events:none}
.lilia{position:absolute;left:50%;bottom:20%;width:min(86%,400px);transform:translateX(-50%);transition:filter .3s}
.lilia svg{display:block;width:100%;height:auto;transform-origin:50% 100%;animation:breathe 4s ease-in-out infinite}
.lilia.poke svg{animation:poke .45s ease}
@keyframes breathe{50%{transform:translateY(3px) scaleY(.995)}}
@keyframes poke{30%{transform:translateY(-10px)}60%{transform:translateY(2px)}}
#eyes{transform-origin:150px 132px;animation:blinky 5s infinite}
@keyframes blinky{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.counter{position:absolute;left:0;right:0;bottom:0;height:24%}
.counter svg{width:100%;height:100%;display:block}
.app.dim .counter{filter:brightness(.45) blur(1.5px)}   /* keep the counter so Lilia doesn't float */
.app.dim .lilia,.app.dim .scene{filter:brightness(.45) blur(1.5px)}

/* ---------- HUD ---------- */
.hud{position:absolute;top:0;left:0;right:0;padding:10px 10px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;z-index:5}
.plate{display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,rgba(10,16,40,.9),rgba(10,16,40,.55));border:1.5px solid var(--gold);border-radius:999px;padding:4px 14px 4px 4px;min-width:0;box-shadow:0 2px 10px rgba(0,0,0,.5)}
.lv{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff3b8,var(--gold) 45%,var(--gold-dk));color:#3a2205;font-family:var(--display);font-weight:900;line-height:1;text-align:center;box-shadow:inset 0 0 0 2px #fff6cf,0 0 10px rgba(243,203,100,.6)}
.lv small{display:block;font-size:8px}
.lv b{font-size:18px}
.pname{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw;text-shadow:0 1px 2px #000}
.rankline{font-size:11px;color:var(--gold);font-weight:700}
.xpbar{height:6px;width:120px;max-width:36vw;background:rgba(255,255,255,.15);border-radius:9px;overflow:hidden;margin-top:2px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#7fd8ff,#e6f7ff);box-shadow:0 0 6px #7fd8ff;transition:width .6s}
.res{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.pill{display:flex;align-items:center;gap:6px;background:rgba(10,16,40,.85);border:1.5px solid var(--gold);border-radius:999px;padding:3px 12px 3px 4px;font-weight:800;font-variant-numeric:tabular-nums;font-size:14px;min-width:96px;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.pill svg{width:22px;height:22px;flex:none}

/* ---------- side buttons (home) ---------- */
.side{position:absolute;right:10px;top:96px;display:flex;flex-direction:column;gap:14px;z-index:4}
.orb{position:relative;width:62px;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;text-shadow:0 1px 3px #000,0 0 2px #000}
.orb .ring{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 30%,#4f7dff,#1a2c8a 70%);border:2px solid var(--gold);box-shadow:0 0 12px rgba(120,170,255,.6),inset 0 0 0 2px rgba(255,255,255,.25)}
.orb.gold .ring{background:radial-gradient(circle at 40% 30%,#ffe9a0,#c98a1a 70%);box-shadow:0 0 14px rgba(255,210,90,.8),inset 0 0 0 2px rgba(255,255,255,.4)}
.orb svg{width:30px;height:30px}
.badge{position:absolute;top:-2px;right:0;min-width:20px;height:20px;border-radius:10px;background:var(--rose);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px;border:2px solid #fff;text-shadow:none}

/* ---------- dialogue ---------- */
.dialog{position:absolute;left:10px;right:10px;bottom:96px;z-index:4;background:linear-gradient(180deg,rgba(14,22,56,.94),rgba(8,12,34,.94));border:2px solid var(--gold);border-radius:14px;padding:18px 16px 14px;box-shadow:0 0 0 4px rgba(10,16,40,.6),0 6px 16px rgba(0,0,0,.6);min-height:86px}
.dialog::before{content:"";position:absolute;inset:4px;border:1px solid rgba(243,203,100,.4);border-radius:10px;pointer-events:none}
.nametag{position:absolute;top:-14px;left:16px;background:linear-gradient(180deg,#ff8eab,#d64a72);color:#fff;font-family:var(--display);font-weight:900;font-size:13px;letter-spacing:.08em;padding:3px 16px;border-radius:4px;border:1.5px solid #ffe0e8;box-shadow:0 2px 6px rgba(0,0,0,.5)}
#lilia{font-size:15px;font-weight:500;display:block}
.tri{position:absolute;right:14px;bottom:8px;color:var(--gold);font-size:11px;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}

/* ---------- bottom nav ---------- */
.nav{position:absolute;left:0;right:0;bottom:0;height:84px;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:0 6px 8px;
  background:linear-gradient(180deg,rgba(10,14,36,0),rgba(10,14,36,.96) 30%);}
.nav::before{content:"";position:absolute;left:0;right:0;top:24px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:800;color:#c9d2ff;position:relative;padding:0}
.nav button svg{width:30px;height:30px}
.nav button[aria-selected="true"]{color:var(--gold)}
.nav button[aria-selected="true"] svg{filter:drop-shadow(0 0 6px rgba(243,203,100,.9))}
.nav .big .disc{width:62px;height:62px;margin-top:-26px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 30%,#fff1b0,var(--gold) 45%,var(--gold-dk));border:3px solid #fff3c8;box-shadow:0 0 16px rgba(243,203,100,.8)}
.nav .big svg{width:34px;height:34px}
.nav .big{color:var(--gold)}

/* ---------- panels ---------- */
.panel{position:absolute;left:10px;right:10px;top:88px;bottom:90px;z-index:3;overflow:auto;display:none;flex-direction:column;gap:14px;padding:18px 2px 10px;scrollbar-width:thin}
.app.dim .panel{display:flex}
.frame{position:relative;background:var(--night);border:2px solid var(--gold);border-radius:12px;padding:22px 14px 14px;box-shadow:0 0 0 4px rgba(10,16,40,.55),0 8px 20px rgba(0,0,0,.6)}
.frame::before{content:"";position:absolute;inset:4px;border:1px solid rgba(243,203,100,.35);border-radius:8px;pointer-events:none}
.frame::after{content:"◆";position:absolute;top:-11px;right:14px;color:var(--gold);font-size:14px;text-shadow:0 0 6px var(--gold)}
.ribbon{position:absolute;top:-15px;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:var(--display);font-weight:900;font-size:14px;letter-spacing:.12em;color:#3a2205;
  background:linear-gradient(180deg,#fff0b0,var(--gold) 50%,#c8932a);padding:4px 22px;clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%);text-shadow:0 1px 0 rgba(255,255,255,.5)}
.sub{font-size:12px;color:#aeb8e8}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 4px;border-top:1px solid rgba(243,203,100,.18);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.row:first-of-type{border-top:0}
.row small{display:block;color:#aeb8e8;font-size:12px}
.row .rt{text-align:right;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;font-size:13px}
.none{color:#aeb8e8;font-size:13px;padding:6px 4px;text-align:center}
.stars{color:var(--gold);letter-spacing:-1px;font-size:12px;text-shadow:0 0 4px rgba(243,203,100,.6)}
.gem{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:16px;color:#fff;border:2px solid rgba(255,255,255,.6);text-shadow:0 1px 2px rgba(0,0,0,.6)}
.r-E{background:linear-gradient(160deg,#a9b4c7,#5f6b7f)}.r-D{background:linear-gradient(160deg,#69a6ff,#2459b8)}.r-C{background:linear-gradient(160deg,#5fe0c8,#13806f)}.r-B{background:linear-gradient(160deg,#c79bff,#6a2fbd)}.r-A{background:linear-gradient(160deg,#ffe28a,#c27e0a)}

/* corkboard */
.cork{background-color:#9c6a3a;background-image:radial-gradient(rgba(0,0,0,.18) 1px,transparent 1.6px),radial-gradient(rgba(255,240,200,.12) 1px,transparent 1.6px);background-size:7px 7px,11px 11px;background-position:0 0,3px 5px;
  border-radius:6px;box-shadow:inset 0 0 0 4px #5b3519,inset 0 6px 16px rgba(0,0,0,.5);padding:20px 12px 16px}
.notices{display:grid;grid-template-columns:repeat(2,1fr);gap:20px 12px}
.notice{position:relative;background:var(--paper);color:var(--ink);border:0;text-align:left;padding:18px 10px 10px;min-height:124px;display:flex;flex-direction:column;gap:5px;
  background-image:linear-gradient(180deg,rgba(255,255,255,.4),transparent 30%),radial-gradient(ellipse at 50% 50%,transparent 60%,rgba(120,80,30,.28));
  box-shadow:3px 5px 0 rgba(0,0,0,.35);transform:rotate(var(--r,0deg));transition:transform .15s}
.notice:hover,.notice:focus-visible{transform:rotate(0) scale(1.04);z-index:2}
.notice::before{content:"";position:absolute;top:-7px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff9d93,#c8302c 55%,#7a1512);box-shadow:1px 2px 0 rgba(0,0,0,.4)}
.notice.bounty{background-color:#f8db8c;outline:2px solid #e0a619;outline-offset:-5px}
.notice.bounty::before{background:radial-gradient(circle at 35% 35%,#fff6b0,#d9a400 55%,#7a5a00)}
.notice .nh{font-family:var(--display);font-weight:900;font-size:10px;letter-spacing:.12em;opacity:.7}
.notice .nt{font-weight:700;font-size:14.5px;line-height:1.3}
.notice .ns{color:#b8800c;font-size:12px;letter-spacing:-1px}
.notice .nr{margin-top:auto;font-size:11px;font-weight:700;display:flex;justify-content:space-between;gap:2px;font-variant-numeric:tabular-nums}
.stamp{position:absolute;top:7px;right:7px;width:28px;height:28px;border:2px solid currentColor;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:13px;transform:rotate(-12deg);opacity:.85}
.c-S{color:#d4407a}.r-S{background:linear-gradient(160deg,#ffb3d1,#d4407a 55%,#7a3cc4)}
.notice.storyq{box-shadow:0 0 0 3px #ffd166,0 0 16px rgba(255,209,102,.7),0 6px 10px rgba(0,0,0,.4)}
.rankprev .c-S{color:#ff9db4}
.c-E{color:#5f6b7f}.c-D{color:#2459b8}.c-C{color:#13806f}.c-B{color:#7a3cc4}.c-A{color:#b5780a}
.board-empty{grid-column:1/-1;background:var(--paper);color:var(--ink);padding:14px;text-align:center;box-shadow:3px 5px 0 rgba(0,0,0,.35);transform:rotate(-1deg)}

/* buttons */
.gbtn{border:0;border-radius:999px;padding:12px 18px;font-weight:800;font-size:15px;width:100%;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#fff2b8,var(--gold) 45%,#c8902a);color:#3a2205;box-shadow:0 0 0 2px #fff6cf inset,0 3px 0 #7a5410,0 6px 12px rgba(0,0,0,.4)}
.gbtn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);animation:shine 3s infinite}
@keyframes shine{0%{left:-60%}40%,100%{left:130%}}
.gbtn.blue{background:linear-gradient(180deg,#8fb2ff,var(--blue) 50%,#1b3a9e);color:#fff;box-shadow:0 0 0 2px #cfe0ff inset,0 3px 0 #0e2266,0 6px 12px rgba(0,0,0,.4)}
.gbtn.blue::after,.gbtn.plain::after{display:none}
.gbtn.plain{background:rgba(255,255,255,.08);color:var(--cream);box-shadow:0 0 0 1.5px rgba(243,203,100,.6) inset}
.gbtn:active{transform:translateY(2px)}
.gbtn:disabled{opacity:.55;cursor:default}
.btns{display:flex;flex-direction:column;gap:10px}
.mini{background:none;border:1.5px solid #ff9b8f;color:#ff9b8f;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}

/* forms */
form{display:flex;flex-direction:column;gap:10px}
label{font-size:12px;color:var(--gold);font-weight:800;display:flex;flex-direction:column;gap:4px;letter-spacing:.04em}
input[type=text],select{background:rgba(0,0,0,.35);border:1.5px solid rgba(243,203,100,.6);border-radius:8px;padding:9px 10px;color:var(--cream);width:100%}
.r3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:400px){.r3{grid-template-columns:1fr 1fr}.r3 label:last-child{grid-column:1/-1}}
.note{font-size:12.5px;color:#aeb8e8}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.tiles b{display:block;font-family:var(--display);font-weight:900;font-size:24px;color:var(--gold);text-shadow:0 0 8px rgba(243,203,100,.5)}
.tiles span{font-size:12px;color:#aeb8e8}

/* modal */
.modal{position:absolute;inset:0;z-index:20;background:rgba(4,6,20,.7);display:none;align-items:center;justify-content:center;padding:14px}
.modal.open{display:flex}
.sheet{width:100%;max-height:88%;overflow:auto;display:flex;flex-direction:column;gap:12px;padding-top:40px}
.sheet .ribbon{top:8px}
.sheet.frame::before{display:none}   /* the inner border scrolled with long content and cut across buttons */
.sheet.frame{box-shadow:inset 0 0 0 3px var(--night),inset 0 0 0 4px rgba(243,203,100,.35),0 0 0 4px rgba(10,16,40,.55),0 8px 20px rgba(0,0,0,.6)}
.sheet > *,.panel > *{flex-shrink:0}
.parch{background:var(--paper);color:var(--ink);border-radius:4px;padding:16px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 0 30px rgba(120,80,30,.35)}
.parch h3{margin:2px 0 4px;font-size:19px;line-height:1.25}
.parch .kv{display:flex;justify-content:space-between;gap:8px;border-top:1px dashed rgba(59,36,18,.3);padding-top:6px;font-size:14px;font-variant-numeric:tabular-nums}
.sheet h3.t{margin:0;font-size:18px;text-align:center}
.sign{display:flex;gap:12px;align-items:center;background:rgba(243,203,100,.12);border:1.5px solid var(--gold);border-radius:10px;padding:10px 12px;font-size:14px}
.sign .big{font-size:36px;line-height:1}
.filebtn{display:block;text-align:center;border:2px dashed var(--gold);color:var(--gold);border-radius:10px;padding:14px;font-weight:800;cursor:pointer;position:relative}
.filebtn input{position:absolute;opacity:0;width:1px;height:1px}
.preview{width:100%;max-height:250px;object-fit:contain;border-radius:8px;border:2px solid var(--gold);background:#000;display:none}
.verdict{padding:9px 12px;border-radius:8px;font-size:14px}
.verdict.ok{background:rgba(60,200,140,.15);border:1.5px solid #7ff0b0;color:#b4ffd6}
.verdict.no{background:rgba(255,110,90,.12);border:1.5px solid #ff9b8f;color:#ffcbc4}
.verdict.wait{border:1.5px solid #aeb8e8;color:#aeb8e8}

/* reward splash */
.splash{position:absolute;inset:0;z-index:30;display:none;place-items:center;background:radial-gradient(circle,rgba(40,30,80,.85),rgba(4,6,20,.95));overflow:hidden}
.splash.show{display:grid}
.rays{position:absolute;left:50%;top:42%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;
  background:repeating-conic-gradient(rgba(255,226,140,.18) 0 8deg,transparent 8deg 20deg);animation:spin 18s linear infinite;
  -webkit-mask:radial-gradient(circle,#000 10%,transparent 45%);mask:radial-gradient(circle,#000 10%,transparent 45%)}
@keyframes spin{to{transform:rotate(360deg)}}
.sp-in{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px}
.sp-title{font-family:var(--display);font-weight:900;font-size:clamp(34px,11vw,52px);line-height:1;letter-spacing:.04em;
  background:linear-gradient(180deg,#fffbe6,#ffd75e 50%,#d18a12);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #5a3500) drop-shadow(0 0 16px rgba(255,200,80,.7));animation:slam .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes slam{0%{transform:scale(2.2);opacity:0}100%{transform:scale(1);opacity:1}}
.sp-sub{font-weight:800;font-size:16px;color:#fff}
.loot{display:flex;gap:14px}
.loot div{background:var(--night);border:2px solid var(--gold);border-radius:12px;padding:10px 14px;min-width:110px;display:flex;flex-direction:column;align-items:center;gap:2px;animation:pop .4s .25s both}
.loot svg{width:40px;height:40px}
.loot b{font-family:var(--display);font-weight:900;font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums}
.loot span{font-size:11px;color:#aeb8e8;font-weight:700}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.tap{font-size:12px;color:#aeb8e8;animation:bob 1.2s infinite}
.toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);z-index:25;background:var(--night);border:1.5px solid var(--gold);border-radius:999px;padding:7px 16px;font-weight:700;font-size:13px;display:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.toast.show{display:block}
.status{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:10px;color:rgba(200,210,255,.5);z-index:7;pointer-events:none}

/* ---------- adventure ---------- */
.subtabs{display:flex;gap:6px;position:sticky;top:0;z-index:2;padding:2px 0 4px}
.subtabs button{flex:1;border:1.5px solid var(--gold);background:rgba(10,16,40,.92);border-radius:999px;padding:7px 2px;font-weight:800;font-size:12.5px;color:var(--cream)}
.subtabs button.on{background:linear-gradient(180deg,#fff2b8,var(--gold) 45%,#c8902a);color:#3a2205}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid rgba(243,203,100,.6);background:rgba(0,0,0,.3);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.chip small{opacity:.75;font-size:11px}
.chip.on{background:var(--gold);color:#3a2205}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.35);padding:0}
.sw.on{border:3px solid var(--gold);box-shadow:0 0 10px var(--gold)}
.creator{display:flex;flex-direction:column;gap:12px}
.av-big{width:150px;margin:0 auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.opt>span{font-size:12px;color:var(--gold);font-weight:800;display:block;margin-bottom:6px;letter-spacing:.04em}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{border:1.5px solid rgba(243,203,100,.45);background:rgba(0,0,0,.3);border-radius:10px;padding:8px 10px;text-align:left;font-size:12.5px;color:#c9d2ff}
.card b{display:block;font-size:14px;color:var(--cream)}
.card.on{border-color:var(--gold);background:rgba(243,203,100,.18);box-shadow:0 0 0 1px var(--gold)}
.herotop{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center}
.clspill{display:inline-block;background:linear-gradient(180deg,#ff8eab,#d64a72);border-radius:999px;padding:1px 10px;font-size:12px;font-weight:800;margin-top:4px}
.derived{display:flex;gap:12px;margin-top:8px;font-size:13px;font-variant-numeric:tabular-nums}
.derived b{color:var(--gold)}
.statrow{display:grid;grid-template-columns:1fr auto 34px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid rgba(243,203,100,.15)}
.statrow .sv{font-family:var(--display);font-size:20px;color:var(--gold);font-variant-numeric:tabular-nums}
.plus{width:32px;height:32px;border-radius:50%;border:2px solid #fff6cf;background:var(--gold);color:#3a2205;font-weight:900;font-size:18px;line-height:1;padding:0;box-shadow:0 0 8px rgba(243,203,100,.7)}
.bag{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.bag div{background:rgba(0,0,0,.3);border:1px solid rgba(243,203,100,.35);border-radius:8px;padding:6px 4px;text-align:center;font-size:11px;line-height:1.3}
.bag b{display:block;font-size:24px;line-height:1.3}
.thumb{width:48px;height:48px}
.ing{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.ing span{font-size:12px;background:rgba(0,0,0,.35);border-radius:999px;padding:1px 8px}
.ing .ok{color:#7ff0b0}.ing .no{color:#ff9b8f}
.gbtn.sm{width:auto;padding:8px 12px;font-size:13px;white-space:nowrap}
.gbtn.ready{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 2px #fff6cf inset,0 0 18px 4px rgba(255,220,120,.9)}}
/* arena */
.arena{position:absolute;inset:0;z-index:15;display:none;flex-direction:column;background:#0b1030}
.arena.show{display:flex}
.ar-top{padding:12px 14px 10px;background:var(--night);border-bottom:2px solid var(--gold);display:flex;flex-direction:column;gap:6px}
.ar-name{font-family:var(--display);font-weight:900;font-size:17px;display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.field{position:relative;flex:1;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.mon{position:absolute;left:50%;top:12%;width:min(52vw,220px);margin-left:calc(min(52vw,220px) / -2);filter:drop-shadow(0 12px 10px rgba(0,0,0,.45));animation:float 2.4s ease-in-out infinite}
.mon svg,.heroEl svg{display:block;width:100%;height:auto}
@keyframes float{50%{transform:translateY(-8px)}}
.mon.hit,.heroEl.hit{animation:shake .25s}
.mon.dead{animation:die .8s forwards}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes die{to{transform:scale(.2) rotate(20deg);opacity:0;filter:brightness(3)}}
.heroEl{position:absolute;left:6%;bottom:3%;width:min(30vw,130px)}
.beat{position:absolute;width:0;height:0;pointer-events:none}
.beat .tgt,.beat .ring{position:absolute;left:-34px;top:-34px;width:68px;height:68px;border-radius:50%}
.beat .tgt{border:3px solid rgba(255,255,255,.9);background:radial-gradient(circle,rgba(255,255,255,.35),rgba(255,255,255,.05) 70%)}
.beat .ring{border:5px solid var(--gold);box-shadow:0 0 12px var(--gold)}
.beat.def .ring{border-color:#ff5d5d;box-shadow:0 0 12px #ff5d5d}
.beat.def .tgt{border-color:#ffb3b3;background:radial-gradient(circle,rgba(255,93,93,.35),transparent 70%)}
.beat.skill .ring{border-color:#9be7ff;box-shadow:0 0 18px #9be7ff}
.pop{position:absolute;transform:translate(-50%,-50%);font-family:var(--display);font-weight:900;font-size:22px;pointer-events:none;animation:rise .85s ease-out forwards;text-shadow:0 2px 0 #000,0 0 6px #000;white-space:nowrap;color:#fff;z-index:4}
.pop.perfect{color:var(--gold);font-size:26px}.pop.miss{color:#aeb8e8}.pop.heal{color:#7ff0b0}.pop.hurt{color:#ff7a7a}
@keyframes rise{to{transform:translate(-50%,-170%);opacity:0}}
.banner{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(10,16,40,.85);border:1.5px solid var(--gold);border-radius:999px;padding:4px 16px;font-weight:800;font-size:13px;white-space:nowrap;z-index:3}
.banner.in{animation:bannerIn .3s}
@keyframes bannerIn{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.hpbar{height:12px;background:rgba(0,0,0,.5);border:1.5px solid var(--gold);border-radius:8px;overflow:hidden}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#ff4d6a,#ff9a8a);transition:width .3s}
.hpbar.me i{background:linear-gradient(90deg,#2fc27a,#9cf5c0)}
.hpbar.sp i{background:linear-gradient(90deg,#4aa8ff,#bfe8ff)}
.ar-bot{padding:10px 12px 16px;background:var(--night);border-top:2px solid var(--gold);display:flex;flex-direction:column;gap:8px}
.hrow{display:grid;grid-template-columns:26px 1fr 64px;gap:8px;align-items:center;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.ctrl{display:grid;grid-template-columns:1.5fr 1fr 1fr .9fr;gap:6px}
.ctrl .gbtn{padding:10px 4px;font-size:13px}
.spark{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border:0;border-radius:50%;padding:0;background:radial-gradient(circle,#fff 0 14%,rgba(255,240,160,.95) 28%,rgba(255,220,120,0) 70%);animation:twinkle .5s ease-in-out infinite alternate}
.spark.rare{background:radial-gradient(circle,#fff 0 14%,rgba(190,150,255,.95) 28%,rgba(140,100,255,0) 70%)}
@keyframes twinkle{to{transform:scale(1.2) rotate(20deg)}}
.haul{font-size:16px;text-align:center;min-height:24px}

/* ---------- rhythm battle ---------- */
.row.hunt{grid-template-columns:1fr auto}
.hdiff{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:999px;vertical-align:2px;margin-left:4px;border:1px solid}
.hdiff.tough{color:#ffb0a0;border-color:#e0573f;background:rgba(224,87,63,.18)}
.hdiff.even{color:#ffe08a;border-color:#d6a83a;background:rgba(214,168,58,.16)}
.hdiff.easy{color:#a8f0b8;border-color:#4fb36a;background:rgba(79,179,106,.15)}
.hdiff.breeze{color:#b8dcff;border-color:#5f93c9;background:rgba(95,147,201,.15)}
.thumbs{display:flex;gap:2px;margin-top:4px}
.thumb.sm{width:34px;height:34px}
.mute{background:none;border:1.5px solid var(--gold);border-radius:999px;width:34px;height:30px;font-size:15px;padding:0;margin-left:auto}
.ar-name{align-items:center}
#foes{position:absolute;left:0;right:0;top:0;height:58%}
.foe{position:absolute;top:16%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px;transition:opacity .5s}
.foe.solo{width:min(48vw,200px)}.foe.duo{width:min(36vw,150px)}.foe.trio{width:min(28vw,118px)}
.foe.boss{width:min(62vw,250px);top:10%}
.fname{font-size:11px;font-weight:800;white-space:nowrap;text-shadow:0 1px 2px #000,0 0 3px #000}
.foe.boss .fname{font-family:var(--display);font-size:14px;color:var(--gold)}
.fhp{width:80%;height:7px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.6);border-radius:6px;overflow:hidden}
.fhp i{display:block;height:100%;background:linear-gradient(90deg,#ff4d6a,#ff9a8a);transition:width .25s}
.foe .sprite{width:100%;filter:drop-shadow(0 12px 10px rgba(0,0,0,.45));animation:float 2.4s ease-in-out infinite}
.foe .sprite.enter{animation:enter .6s ease-out}
.foe .sprite.hit{animation:shake .22s}
.foe.dead{opacity:0;pointer-events:none}
.foe.dead .sprite{animation:die .6s forwards}
@keyframes enter{from{transform:translateY(-40px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.tmark{color:var(--gold);font-size:14px;line-height:1;visibility:hidden;animation:bob 1s infinite;text-shadow:0 0 6px var(--gold)}
.foe.targeted .tmark{visibility:visible}
.heroEl .sprite{width:100%}
.beat.hold .tgt{background:conic-gradient(rgba(255,226,120,.85) var(--p,0deg),rgba(255,255,255,.12) 0);border-style:double;border-width:5px}
.beat.def.hold .tgt{background:conic-gradient(rgba(255,120,120,.85) var(--p,0deg),rgba(255,93,93,.15) 0)}
.beat.holding .ring{opacity:0}
.beat.holding .tgt{box-shadow:0 0 18px var(--gold)}
.beat.heavy .tgt::after{content:"HOLD";position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000}
.beat.hold:not(.heavy):not(.skill) .tgt::after{content:"HOLD";position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:900;color:#3a2205}
.beat.skill .tgt{left:-44px;top:-44px;width:88px;height:88px;border:4px solid #fff;background:conic-gradient(from 0deg,rgba(255,110,140,.6),rgba(255,226,120,.6),rgba(120,230,255,.6),rgba(190,140,255,.6),rgba(255,110,140,.6));box-shadow:0 0 22px rgba(255,255,255,.8)}
.beat.skill.hold .tgt{background:conic-gradient(rgba(255,255,255,.9) var(--p,0deg),transparent 0),conic-gradient(from 0deg,rgba(255,110,140,.6),rgba(255,226,120,.6),rgba(120,230,255,.6),rgba(190,140,255,.6),rgba(255,110,140,.6))}
.beat.skill .ring{left:-44px;top:-44px;width:88px;height:88px;border:6px solid transparent;background:linear-gradient(#000,#000) padding-box,conic-gradient(#ff6e8c,#ffe278,#78e6ff,#be8cff,#ff6e8c) border-box;-webkit-mask:radial-gradient(circle,transparent 60%,#000 61%);mask:radial-gradient(circle,transparent 60%,#000 61%);box-shadow:none}
.beat .star{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font-size:40px;color:#fff;text-shadow:0 0 12px #ffe278,0 0 24px #ff6e8c;animation:spinstar 1.2s linear infinite}
@keyframes spinstar{to{transform:translate(-50%,-50%) rotate(360deg)}}
.cutin{position:absolute;inset:0;z-index:6;pointer-events:none;display:none;background:rgba(0,0,0,.4)}
.cutin.show{display:block;animation:fadeout .25s ease-in calc(var(--d,1s)) forwards}
.ci-band{position:absolute;left:-10%;right:-10%;top:26%;height:40%;transform:skewY(-8deg);background:linear-gradient(90deg,var(--c1),var(--c2));overflow:hidden;box-shadow:0 0 0 4px #fff,0 0 30px rgba(0,0,0,.6);animation:bandIn .25s ease-out}
.ci-lines{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.28) 0 2px,transparent 2px 22px);animation:lines .3s linear infinite}
@keyframes lines{to{transform:translateX(-60px)}}
@keyframes bandIn{from{transform:skewY(-8deg) scaleY(0)}to{transform:skewY(-8deg) scaleY(1)}}
.ci-hero{position:absolute;left:12%;bottom:-18%;width:46%;transform:skewY(8deg);animation:heroIn .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes heroIn{from{transform:skewY(8deg) translateX(-120%)}to{transform:skewY(8deg)}}
.ci-text{position:absolute;right:12%;top:50%;transform:skewY(8deg) translateY(-50%);text-align:right;animation:textIn .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes textIn{from{transform:skewY(8deg) translate(140%,-50%)}to{transform:skewY(8deg) translateY(-50%)}}
.ci-text small{display:block;font-weight:800;font-size:11px;letter-spacing:.12em;color:#fff;text-shadow:0 1px 2px #000}
.ci-text b{display:block;font-family:var(--display);font-weight:900;font-size:clamp(24px,8vw,38px);line-height:1.05;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.5),0 0 18px rgba(255,255,255,.8)}
.flashfx{position:absolute;inset:0;pointer-events:none;z-index:5;opacity:0}
.flashfx.go{animation:flash .5s ease-out}
.flashfx.fire{background:radial-gradient(circle at 50% 35%,rgba(255,200,80,.9),rgba(255,60,30,.5) 40%,transparent 70%)}
.flashfx.holy{background:radial-gradient(circle at 50% 30%,rgba(255,255,230,.95),rgba(255,226,140,.5) 40%,transparent 70%)}
.flashfx.slash,.flashfx.punch{background:rgba(255,255,255,.7)}
.flashfx.shadow{background:rgba(120,60,200,.35)}
.flashfx.arrow{background:linear-gradient(90deg,transparent,rgba(160,255,200,.6),transparent)}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
@keyframes fadeout{to{opacity:0}}
.slashfx{position:absolute;left:-20%;right:-20%;top:28%;height:10px;background:linear-gradient(90deg,transparent,#fff 30%,#ffd23f 50%,#fff 70%,transparent);box-shadow:0 0 20px #ffd23f;transform:rotate(var(--r));animation:slash .5s ease-out forwards;z-index:5;pointer-events:none}
@keyframes slash{from{clip-path:inset(0 100% 0 0)}60%{clip-path:inset(0 0 0 0);opacity:1}to{clip-path:inset(0 0 0 0);opacity:0}}
.burst{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;z-index:5;pointer-events:none;animation:burst .7s ease-out forwards}
.burst.fire{background:radial-gradient(circle,#fff6c0,#ffb13d 35%,#ff3d3d 60%,transparent 70%)}
.burst.holy{background:radial-gradient(circle,#fff,#ffe9a0 40%,transparent 70%)}
.burst.arrow{background:radial-gradient(circle,#fff,#9cf5c0 40%,transparent 70%)}
.burst.punch{background:radial-gradient(circle,#fff,#ffb3b3 40%,transparent 70%)}
.burst.shadow{background:radial-gradient(circle,#e8d8ff,#7a3cc4 40%,transparent 70%)}
@keyframes burst{to{transform:scale(7);opacity:0}}

/* ---------- restructure ---------- */
.plate{cursor:pointer}
.portrait-sm{width:48px;height:48px;flex:none;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 40% 30%,#5b86ff,#1a2c8a 75%);border:2px solid var(--gold);box-shadow:0 0 10px rgba(243,203,100,.55),inset 0 0 0 2px rgba(255,255,255,.25);display:grid;place-items:center}
.portrait-sm svg{width:100%;height:100%;display:block}
.rankline b{font-family:var(--display);font-size:13px;color:var(--gold)}
.panel.sheetup{animation:sheetUp .3s ease-out}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.boardhead{display:flex;gap:8px;align-items:center;position:sticky;top:0;z-index:3}
.boardhead .subtabs{flex:1;position:static;min-width:0}
.boardhead .subtabs button{font-size:11.5px;padding:7px 2px;white-space:nowrap;min-width:0}
.xbtn{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--gold);background:rgba(10,16,40,.92);color:var(--gold);font-weight:900;font-size:16px}
.grp{margin:10px 0 2px;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--gold);text-transform:uppercase}
.mini.edit{border-color:var(--gold);color:var(--gold)}
.poolset{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px;font-size:13px;color:#c9d2ff}
.poolset b{font-family:var(--display);color:var(--gold);font-size:18px}
.poolset .mini,.stepper .mini{border-color:var(--gold);color:var(--gold);width:30px;height:30px;padding:0;font-size:16px}
.cards.three{grid-template-columns:repeat(3,1fr)}
.cards.three .card{padding:7px 8px;font-size:11.5px}
.cards.three .card b{font-size:13px}
.gbtn.danger{color:#ff9b8f;box-shadow:0 0 0 1.5px rgba(255,155,143,.6) inset}
.postform input[type=date]{background:rgba(0,0,0,.35);border:1.5px solid rgba(243,203,100,.6);border-radius:8px;padding:9px 10px;color:var(--cream);width:100%;color-scheme:dark}
.notice.overdue{outline:2px solid #c8302c;outline-offset:-5px}
.notice.overdue .nh{color:#c8302c;opacity:1}
.gcard{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center;background:linear-gradient(135deg,rgba(243,203,100,.16),rgba(47,99,230,.18));border:1.5px solid rgba(243,203,100,.5);border-radius:12px;padding:10px}
.gc-art{filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
.gc-name{font-weight:800;font-size:19px}
.gc-rank{display:flex;gap:12px;align-items:center;margin-top:8px;min-width:0}
.gc-rank > div:last-child{flex:1;min-width:0}
.gc-info{min-width:0}
.gc-rank .crest{width:50px;height:58px;display:grid;place-items:center;align-content:center;background:radial-gradient(circle at 40% 30%,#fff3b8,var(--gold) 50%,var(--gold-dk));color:#3a2205;clip-path:polygon(50% 0,100% 16%,100% 68%,50% 100%,0 68%,0 16%);font-family:var(--display);font-weight:900;font-size:24px;line-height:1}
.gc-rank .crest small{font-size:7px;letter-spacing:.1em}
.gc-rank b{font-family:var(--display);font-size:20px;color:var(--gold)}
.gc-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:12px;color:#c9d2ff}
.gc-stats span{background:rgba(0,0,0,.3);border-radius:8px;padding:5px 2px}
.gc-stats b{display:block;font-size:15px;color:var(--cream);font-variant-numeric:tabular-nums}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.setrow small{display:block;color:#aeb8e8;font-size:12px}
.toggle{flex:none;width:54px;height:30px;border-radius:999px;border:2px solid var(--gold);background:rgba(0,0,0,.4);position:relative;padding:0}
.toggle i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#aeb8e8;transition:left .2s}
.toggle.on{background:rgba(243,203,100,.35)}
.toggle.on i{left:27px;background:var(--gold)}
.stepper{display:flex;align-items:center;gap:8px;flex:none}
.stepper b{min-width:62px;text-align:center;font-variant-numeric:tabular-nums}
#calBox{margin-top:12px}
.calpad{width:100%;height:150px;border-radius:14px;border:3px solid var(--gold);background:radial-gradient(circle,rgba(243,203,100,.25),rgba(10,16,40,.6));font-family:var(--display);font-weight:900;font-size:22px;color:var(--gold);touch-action:none;user-select:none;-webkit-user-select:none}
.calpad.pulse{background:radial-gradient(circle,rgba(243,203,100,.6),rgba(10,16,40,.6))}

.contract{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px;border:1.5px solid rgba(243,203,100,.4);border-radius:10px;background:rgba(0,0,0,.25);margin-top:8px}
.contract.slay{border-color:rgba(255,120,120,.5)}
.contract b{display:block;font-size:14.5px;margin:1px 0 4px}
.contract small{display:block;color:#aeb8e8;font-size:12px;margin-top:3px}
.thumb.big{display:grid;place-items:center;font-size:34px;width:52px;height:52px}
.ctype{font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--gold)}
.contract.slay .ctype{color:#ff9b8f}
.cbar{height:7px;border-radius:6px;background:rgba(0,0,0,.45);overflow:hidden}
.cbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#fff2b8)}
.contract.slay .cbar i{background:linear-gradient(90deg,#ff4d6a,#ff9a8a)}

.codebox{display:flex;gap:8px}
.codebox input{flex:1;background:rgba(0,0,0,.35);border:1.5px solid rgba(243,203,100,.6);border-radius:8px;padding:9px 10px;color:var(--cream);text-transform:uppercase;letter-spacing:.06em}
input[type=email],input[type=password]{background:rgba(0,0,0,.35);border:1.5px solid rgba(243,203,100,.6);border-radius:8px;padding:9px 10px;color:var(--cream);width:100%}
/* ---------- pixel art + party + gacha ---------- */
img.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block;width:100%;height:auto}
img.art{display:block;width:100%;height:auto;object-fit:contain}
.pslot img.art,.rcard img.art,.gfront img.art,.chartop img.art,.ultbtn img.art{border-radius:8px}
.portrait-sm img.art.head{width:100%;height:100%;margin:0;object-fit:cover}
.lilia.drawn svg{display:none}
.lilia-stack{position:relative;transform-origin:50% 100%;animation:breathe 4s ease-in-out infinite}
.lilia-stack img{display:block;width:100%;height:auto}
.lilia-stack img:not(.base){position:absolute;inset:0}
.lilia-stack .eyes_closed,.lilia.blink .lilia-stack .eyes_open{visibility:hidden}
.lilia.blink .lilia-stack .eyes_closed{visibility:visible}
.lilia-stack .mouth_open,.lilia.talk .lilia-stack .mouth_closed{visibility:hidden}
.lilia.talk .lilia-stack .mouth_open{visibility:visible}
img.px.ico{display:inline-block;width:20px;height:20px;vertical-align:-5px}
img.px.lootico{width:40px;height:40px}
.portrait-sm img.head{width:190%;max-width:none;margin:-4% 0 0 -45%}
.thumb img{width:100%}
button.pill{cursor:pointer;color:var(--cream)}
.wklist{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px;font-size:11px;color:#c9d2ff}
.wk{color:#9cf5c0;margin-left:2px}.rs{color:#ff9b8f;margin-left:4px}
.fweak{font-size:10px;line-height:1;background:rgba(0,0,0,.5);border-radius:6px;padding:2px 5px;white-space:nowrap}
.pslots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pslot{border:2px solid rgba(243,203,100,.5);background:rgba(0,0,0,.3);border-radius:12px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--cream);font-size:12px;text-align:center;min-height:150px;justify-content:flex-end}
.pslot img{width:78%}
.pslot b{font-size:13px}.pslot small{color:#c9d2ff;font-size:10.5px}
.pslot.hero{border-color:var(--gold);background:linear-gradient(180deg,rgba(243,203,100,.2),rgba(0,0,0,.3))}
.pslot.empty{border-style:dashed;justify-content:center}
.pslot.empty .pplus{font-size:30px;line-height:1;color:var(--gold)}
.pslot.r5,.rcard.r5{border-color:#ffd23f;box-shadow:0 0 10px rgba(255,210,63,.45)}
.pslot.r4,.rcard.r4{border-color:#c79bff}
.pslot.r3,.rcard.r3{border-color:#69a6ff}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.rcard{position:relative;border:2px solid;border-radius:10px;padding:4px 4px 6px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.35));color:var(--cream);display:flex;flex-direction:column;align-items:center;font-size:12px}
.rcard.r5{background:linear-gradient(180deg,rgba(255,210,63,.28),rgba(0,0,0,.35))}
.rcard.r4{background:linear-gradient(180deg,rgba(199,155,255,.25),rgba(0,0,0,.35))}
.rcard img{width:80%}
.rcard small{color:#c9d2ff;font-size:11px}
.rstars{color:var(--gold);font-size:10px;letter-spacing:-1px}
.rcard.inteam{outline:2px solid #7ff0b0;outline-offset:1px}
.intag{position:absolute;top:4px;left:4px;font-size:8px;font-weight:900;background:#2fc27a;color:#062;border-radius:4px;padding:1px 4px}
.chartop{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;border-radius:12px;padding:8px}
.chartop.r5{background:linear-gradient(135deg,rgba(255,210,63,.25),rgba(0,0,0,.2))}
.chartop.r4{background:linear-gradient(135deg,rgba(199,155,255,.22),rgba(0,0,0,.2))}
.chartop.r3{background:linear-gradient(135deg,rgba(105,166,255,.2),rgba(0,0,0,.2))}
.lbpips{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.lbpips i{width:14px;height:14px;border:2px solid var(--gold);transform:rotate(45deg);display:inline-block}
.lbpips i.on{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.lbpips .note{margin-left:6px}
.cardbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:12px}
.cardbtns .gbtn{padding:10px 4px;font-size:12.5px}
/* gacha */
.bannerart{position:relative;height:190px;border-radius:10px;overflow:hidden;background:radial-gradient(circle at 50% 70%,rgba(255,226,120,.45),transparent 60%),linear-gradient(160deg,#3a1d6e,#16224f 60%,#0c1230);border:1.5px solid rgba(243,203,100,.6)}
.bannerart::before{content:"";position:absolute;inset:-50%;background:repeating-conic-gradient(rgba(255,226,140,.10) 0 8deg,transparent 8deg 20deg);animation:spin 30s linear infinite}
.bfig{position:absolute;bottom:-6px;width:38%}
.bfig.f0{left:-2%;transform:scale(.92);filter:brightness(.9)}.bfig.f1{left:31%;width:40%;z-index:2}.bfig.f2{right:-2%;transform:scale(.92);filter:brightness(.9)}
.btitle{position:absolute;top:10px;left:0;right:0;text-align:center;z-index:3}
.btitle small{display:block;font-size:10px;font-weight:900;letter-spacing:.15em;color:var(--gold)}
.btitle b{font-family:var(--display);font-size:20px;text-shadow:0 2px 6px #000}
.gstats{display:flex;justify-content:space-between;gap:8px;margin:10px 2px;font-size:13px;color:#c9d2ff}
.gstats b{color:var(--gold);font-variant-numeric:tabular-nums}
.pullbtns{display:grid;grid-template-columns:1fr 1.3fr;gap:8px}
.pullbtns .gbtn small{display:block;font-size:11px;font-weight:700;opacity:.85}
.earn{display:flex;justify-content:space-between;gap:8px;padding:7px 2px;border-top:1px solid rgba(243,203,100,.15);font-size:13px}
.earn:first-of-type{border-top:0}
.earn b{color:var(--gold);font-size:12px;text-align:right}
.gachafx{position:absolute;inset:0;z-index:35;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;background:radial-gradient(circle,rgba(40,30,90,.95),rgba(4,6,20,.98));overflow:hidden}
.gachafx.show{display:flex}
.gf-rays{position:absolute;left:50%;top:45%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;background:repeating-conic-gradient(rgba(140,180,255,.12) 0 8deg,transparent 8deg 20deg);animation:spin 20s linear infinite}
.gachafx.purple .gf-rays{background:repeating-conic-gradient(rgba(199,155,255,.18) 0 8deg,transparent 8deg 20deg)}
.gachafx.gold .gf-rays{background:repeating-conic-gradient(rgba(255,215,90,.25) 0 8deg,transparent 8deg 20deg)}
.gf-grid{position:relative;display:grid;gap:8px;width:100%;max-width:520px}
.gf-grid.n1{grid-template-columns:minmax(0,min(55vw,220px));justify-content:center}
.gf-grid.n10{grid-template-columns:repeat(5,minmax(0,1fr))}
.gpull{position:relative;aspect-ratio:3/4.2;border:0;padding:0;background:none;perspective:600px;animation:dealIn .35s var(--d) both}
@keyframes dealIn{from{transform:translateY(40px) scale(.6);opacity:0}}
.gback,.gfront{position:absolute;inset:0;border-radius:8px;backface-visibility:hidden;transition:transform .45s;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:4px 3px 5px;overflow:hidden}
.gback{background:linear-gradient(160deg,#2b3f9e,#121a52);border:2px solid var(--gold);color:var(--gold);font-size:22px;justify-content:center}
.gpull.r5 .gback{box-shadow:0 0 16px 3px rgba(255,210,63,.9);animation:glow5 1s infinite alternate}
.gpull.r4 .gback{box-shadow:0 0 12px 2px rgba(199,155,255,.9)}
@keyframes glow5{to{box-shadow:0 0 26px 6px rgba(255,240,150,1)}}
.gfront{transform:rotateY(180deg);border:2px solid;color:var(--cream);font-size:10px;text-align:center}
.gpull.r3 .gfront{border-color:#69a6ff;background:linear-gradient(180deg,#2c4d8f,#101a40)}
.gpull.r4 .gfront{border-color:#c79bff;background:linear-gradient(180deg,#5a3591,#1a1240)}
.gpull.r5 .gfront{border-color:#ffd23f;background:linear-gradient(180deg,#9a6a12,#2a1a08);box-shadow:inset 0 0 18px rgba(255,226,120,.6)}
.gpull.open .gback{transform:rotateY(180deg)}
.gpull.open .gfront{transform:rotateY(360deg)}
.gfront{padding:0}
.gart{position:absolute;inset:0;display:block;overflow:hidden}
.gfront.is-char .gart img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;margin:0;border-radius:0;image-rendering:pixelated}
.gfront.is-char .gart img.px{width:150%;height:auto;max-width:none;position:absolute;left:-25%;top:4%;object-fit:fill}
.gfront.is-item .gart{display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.28),transparent 62%)}
.gfront.is-item .gart img{width:68%;height:auto;margin:0 0 18%;image-rendering:pixelated;filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))}
.gpull{min-width:0}
.gst{position:absolute;top:4px;left:50%;transform:translateX(-50%);z-index:2;white-space:nowrap;color:#ffd23f;font-size:9px;letter-spacing:-1px;padding:1px 5px;border-radius:999px;background:rgba(8,10,30,.7);text-shadow:0 0 4px rgba(255,210,63,.8)}
.gf-grid.n1 .gst{font-size:16px;top:8px;padding:2px 10px}
.ginfo{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;flex-direction:column;align-items:center;gap:1px;padding:14px 3px 5px;background:linear-gradient(180deg,transparent,rgba(6,8,24,.82) 45%,rgba(6,8,24,.95));text-align:center}
.ginfo b{font-size:10.5px;line-height:1.1;color:#fff;text-shadow:0 1px 2px #000;overflow-wrap:anywhere}
.ginfo small{color:#c9d2ff;font-size:8.5px;line-height:1.15}
.gf-grid.n1 .ginfo{padding:28px 8px 10px}
.gf-grid.n1 .ginfo b{font-size:19px}
.gf-grid.n1 .ginfo small{font-size:12.5px}
.gnew{position:static;align-self:center;background:#ff3d6a;color:#fff;font-size:8px;font-weight:900;border-radius:4px;padding:1px 4px;margin-bottom:1px}
.gf-grid.n1 .gnew{font-size:11px;padding:2px 7px}
.gf-grid.n10 .ginfo{padding:8px 2px 3px;background:linear-gradient(180deg,transparent,rgba(6,8,24,.9) 40%)}
.gf-grid.n10 .ginfo small{display:none}
.gf-grid.n10 .ginfo b{font-size:9px}
.gf-grid.n10 .gnew{position:absolute;top:-1px;right:2px;font-size:7px;padding:0 3px;transform:translateY(-100%)}
.gf-grid.n10 .gfront.is-item .gart img{width:62%;margin:10% 0 26%}
.gf-grid.n10 .gst{font-size:8px;padding:0 4px;top:3px}
.gnew.lb{background:#2f9e6f}
.gf-btns{position:relative;display:flex;gap:10px;width:100%;max-width:320px}
/* battle party */
.partyrow{position:absolute;left:2%;right:2%;bottom:2%;display:flex;justify-content:center;gap:2%;align-items:flex-end}
.pm{width:min(26vw,110px);position:relative}
.pm::after{content:"";position:absolute;left:15%;right:15%;bottom:-2px;height:6px;border-radius:50%;background:rgba(0,0,0,.35)}
.pm .sprite{width:100%}
.pm.hit{animation:shake .25s}
.beat.atk .ring{border-color:var(--mc,var(--gold));box-shadow:0 0 12px var(--mc,var(--gold))}
.beat.atk .tgt{border-color:var(--mc,#fff);overflow:hidden}
.tgimg{width:70%!important;margin:14% auto 0;opacity:.85}
.ults{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ultbtn{position:relative;border:2px solid rgba(255,255,255,.25);border-radius:12px;background:rgba(0,0,0,.35);padding:3px 2px 2px;display:flex;flex-direction:column;align-items:center;color:var(--cream);overflow:hidden}
.ultbtn img{width:44px;position:relative;z-index:1}
.ultbtn small{font-size:10px;font-weight:800;position:relative;z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ug{position:absolute;inset:0;background:conic-gradient(var(--mc) var(--g,0deg),transparent 0);opacity:.45}
.ultbtn.ready{border-color:#fff;box-shadow:0 0 14px var(--mc),0 0 0 2px var(--gold) inset;animation:glow 1s ease-in-out infinite}
.ultbtn.ready::after{content:"ULT!";position:absolute;top:2px;right:4px;font-size:9px;font-weight:900;color:var(--gold);z-index:2;text-shadow:0 1px 2px #000}
.ultbtn.queued{border-color:#7ff0b0}
.ultbtn.queued::after{content:"NEXT";position:absolute;top:2px;right:4px;font-size:9px;font-weight:900;color:#7ff0b0;z-index:2}
.ultbtn:disabled{opacity:1}
.ctrl{grid-template-columns:1fr 1fr .9fr!important}
.ci-hero img{width:100%}
.pop.eff{color:#9cf5c0;font-size:16px}
.burst.ice{background:radial-gradient(circle,#fff,#bfefff 35%,#2f7fd8 60%,transparent 70%)}
.burst.thunder{background:radial-gradient(circle,#fff,#ffe066 35%,#7a3cc4 60%,transparent 70%)}
.flashfx.ice{background:radial-gradient(circle at 50% 35%,rgba(220,250,255,.95),rgba(80,160,255,.5) 40%,transparent 70%)}
.flashfx.thunder{background:radial-gradient(circle at 50% 35%,rgba(255,255,200,.95),rgba(160,90,255,.5) 40%,transparent 70%)}
.av-big img{width:150px;margin:0 auto}
.herotop img,.gc-art img{width:100%}

.rankprev{text-align:center;font-size:13.5px;padding:8px;border-radius:8px;background:rgba(0,0,0,.3);border:1px dashed rgba(243,203,100,.4)}
.rankprev b{font-family:var(--display);font-size:16px}
.rankprev .c-E{color:#a9b4c7}.rankprev .c-D{color:#69a6ff}.rankprev .c-C{color:#5fe0c8}.rankprev .c-B{color:#c79bff}.rankprev .c-A{color:#ffe28a}
.chip small{opacity:.7;font-size:10.5px}
.qzbar{height:8px;border-radius:6px;background:rgba(0,0,0,.4);overflow:hidden}
.qzbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#fff2b8);transition:width .3s}
.gbtn.qzopt{text-align:left;padding:12px 16px;font-weight:700}
.catchip{display:inline-block;border:1.5px solid rgba(243,203,100,.6);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;background:rgba(0,0,0,.3)}
.diffrow{display:grid;grid-template-columns:1fr 90px 54px;gap:8px;align-items:center;padding:5px 0;font-size:13px}
.diffrow small{color:#aeb8e8;font-size:11px;text-align:right}
.dbar{height:8px;border-radius:6px;background:rgba(0,0,0,.45);overflow:hidden}
.dbar i{display:block;height:100%;background:linear-gradient(90deg,#7ff0b0,#ffd23f 50%,#ff6a6a)}

.filebtn{background:none;font:inherit;width:100%}
.camfx{position:absolute;inset:0;z-index:60;background:#000;display:flex;flex-direction:column}
.camfx video{flex:1;width:100%;min-height:0;object-fit:cover}
.camfx.flash::after{content:"";position:absolute;inset:0;background:#fff;animation:fadeout .3s forwards}
.camui{padding:12px 16px 22px;background:rgba(8,12,34,.95);border-top:2px solid var(--gold)}
.camui .note{text-align:center;margin:0 0 10px}
.cambtns{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.cambtns .gbtn{width:auto}
.snap{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:radial-gradient(circle,#fff 55%,rgba(255,255,255,.3) 56%);box-shadow:0 0 0 3px var(--gold)}
.snap:active{transform:scale(.92)}

.coach{position:absolute;left:10px;right:10px;bottom:90px;z-index:9;background:linear-gradient(180deg,rgba(20,30,74,.97),rgba(8,12,34,.97));border:2px solid var(--gold);border-radius:14px;padding:16px 14px 12px;box-shadow:0 0 0 4px rgba(10,16,40,.6),0 6px 18px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:8px}
.coach[hidden]{display:none}
.coach p{margin:0;font-size:14px;line-height:1.45}
.coach .gbtn{align-self:flex-end;width:auto}
.app.tutting .panel{bottom:200px}
.tut-hl{position:relative;z-index:2;animation:tutglow 1.1s ease-in-out infinite!important;outline:3px solid #fff2b8;outline-offset:2px;border-radius:10px}
@keyframes tutglow{50%{outline-color:transparent;box-shadow:0 0 18px 6px rgba(255,226,120,.8)}}
.tutq{border-color:#fff2b8;box-shadow:0 0 0 4px rgba(10,16,40,.55),0 0 18px rgba(255,226,120,.5)}
.tutlist{display:flex;flex-direction:column;gap:3px;font-size:13.5px}
.tutlist .ok{color:#9cf5c0}
.aiopt{border:1.5px solid rgba(243,203,100,.45);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;background:rgba(0,0,0,.25)}
.aiopt small{color:#aeb8e8;font-size:12px}
.aiopt a{color:var(--gold);font-weight:800;font-size:13px}

.danger-zone{margin-top:12px;padding:10px;border:1.5px dashed rgba(255,110,90,.6);border-radius:10px;background:rgba(255,60,40,.06)}
.danger-zone b{color:#ff9b8f;font-size:13px;letter-spacing:.04em}
.gbtn.danger-solid{background:linear-gradient(180deg,#ff8f7f,#c8302c 55%,#7a1512);color:#fff;box-shadow:0 0 0 2px #ffcfc8 inset,0 3px 0 #5a0c08}
.gbtn.danger-solid::after{display:none}

.tipbtn{position:absolute;right:12px;bottom:92px;z-index:9;border:2px solid var(--gold);background:linear-gradient(180deg,#ff8eab,#d64a72);color:#fff;font-weight:800;font-size:13px;border-radius:999px;padding:7px 14px;box-shadow:0 4px 12px rgba(0,0,0,.5);animation:bob 1.6s ease-in-out infinite}
.tipbtn[hidden]{display:none}

.gslots{display:grid;gap:8px}
.gslots.n3{grid-template-columns:repeat(3,1fr)}.gslots.n2{grid-template-columns:repeat(2,1fr)}
.gslot{border:2px solid rgba(243,203,100,.55);border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(0,0,0,.35));color:var(--cream);padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-height:132px}
.gslot .gs-l{font-size:10px;font-weight:900;letter-spacing:.1em;color:var(--gold);text-transform:uppercase}
img.px.gsico{width:48px;height:48px;margin:4px 0}
.gs-empty{width:48px;height:48px;margin:4px 0;border:2px dashed rgba(243,203,100,.5);border-radius:10px;display:grid;place-items:center;color:var(--gold);font-size:22px}
.gslot b{font-size:12.5px;line-height:1.2}
.gslot small{font-size:10.5px;color:#aeb8e8;line-height:1.25}
.gpf{justify-content:center}
.gplist{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow:auto}
.gprow{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:8px;border:1.5px solid rgba(243,203,100,.25);border-radius:10px;background:rgba(0,0,0,.25)}
.gprow.on{border-color:#7ff0b0;background:rgba(60,200,140,.1)}
img.px.gpico{width:36px;height:36px}
.gprow b{display:block;font-size:13.5px}
.gprow small{display:block;font-size:11.5px;color:#aeb8e8}
.gprow small.st-on{color:#7ff0b0}.gprow small.st-off{color:#ff9b8f}
.eqtag{font-size:11px;font-weight:900;color:#7ff0b0;padding:4px 8px;border:1.5px solid #7ff0b0;border-radius:999px}
.eqtag.off{color:#ff9b8f;border-color:#ff9b8f}
.lpop{position:absolute;inset:0;z-index:50;background:rgba(4,6,20,.55);cursor:pointer}
.lpop[hidden]{display:none}
.lp-art{position:absolute;left:-16%;bottom:150px;width:78%;max-width:380px;animation:lpIn .35s ease-out;pointer-events:none}
.lp-art svg,.lp-art .lilia-stack{width:100%;height:auto;display:block}
@keyframes lpIn{from{transform:translateX(-30px);opacity:0}}
.lp-box{position:absolute;left:10px;right:10px;bottom:96px;background:linear-gradient(180deg,rgba(20,30,74,.97),rgba(8,12,34,.97));border:2px solid var(--gold);border-radius:14px;padding:18px 16px 12px;box-shadow:0 0 0 4px rgba(10,16,40,.6),0 6px 18px rgba(0,0,0,.6);animation:pop .3s ease-out}
.lp-box p{margin:0 0 6px;font-size:15px;line-height:1.5}
.lp-box .tap{display:block;text-align:right;font-size:11px;color:var(--gold)}
.flashsec{animation:flashsec 1.6s ease-out}
@keyframes flashsec{0%,40%{box-shadow:0 0 0 3px var(--gold),0 0 24px rgba(243,203,100,.6)}}
.tixbox{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:10px;padding:10px;border:1.5px solid rgba(243,203,100,.35);border-radius:10px;background:rgba(0,0,0,.25)}
.tixbox small{display:block;font-size:11px;color:#aeb8e8;margin-top:2px}
.tixbtns{display:flex;flex-direction:column;gap:4px}
.starterbnr{margin:10px 0 2px;padding:10px 12px;border-radius:12px;text-align:center;background:linear-gradient(90deg,rgba(255,224,102,.22),rgba(255,157,180,.22),rgba(255,224,102,.22));border:2px solid #ffe066;box-shadow:0 0 14px rgba(255,224,102,.35);animation:sbGlow 2s ease-in-out infinite}
.starterbnr .sb-t{display:block;font-family:var(--display);letter-spacing:.12em;color:#ffe066;font-size:14px;margin-bottom:3px}
.starterbnr span{font-size:12.5px;line-height:1.45}.starterbnr span b{color:#fff3c4}

.freetag{display:inline-block;margin-left:4px;padding:1px 6px;border-radius:999px;background:#7ff0b0;color:#0b2a1c;font-size:10px;font-weight:900;vertical-align:middle}
.gf-note{position:relative;z-index:2;margin:6px 16px 0;text-align:center;font-size:12.5px;color:#fff3c4}
.gf-pair{display:flex;gap:8px;width:100%}.gf-pair .gbtn{flex:1}
.fdots{display:block;font-size:11px;letter-spacing:2px;color:var(--gold)}

.pc{display:flex;flex-direction:column;gap:10px}
.pc-stage{position:relative;align-self:center;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(255,240,200,.22),rgba(255,240,200,.04) 62%,transparent 70%);display:grid;place-items:center}
.pc-stage img{width:150px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}

.pc-row > *{flex:0 0 auto;scroll-snap-align:center}
.pc-cats{gap:6px;padding-bottom:6px;border-bottom:1.5px solid rgba(243,203,100,.25)}
.pc-cat{position:relative;min-width:62px;border:1.5px solid rgba(243,203,100,.3);border-radius:10px;background:rgba(0,0,0,.3);color:var(--cream);font-size:10.5px;font-weight:800;padding:5px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}

.gfield-basket,.gfield-fish,.gfield-cart{touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.gbasket{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-size:52px;line-height:1;filter:drop-shadow(0 4px 4px rgba(0,0,0,.4));pointer-events:none}

.ti-glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,rgba(243,203,100,.25),transparent 55%);animation:tiPulse 3s ease-in-out infinite}
.ti-logo{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;animation:tiDrop .8s cubic-bezier(.2,1.4,.4,1) both}
.ti-logo small{font-family:var(--display);font-weight:900;font-size:18px;letter-spacing:.25em;color:#ffd6e4;text-shadow:0 2px 0 #7a2346,0 0 12px rgba(255,142,171,.6)}
.ti-logo b{font-family:var(--display);font-weight:900;font-size:44px;line-height:1;color:#ffe08a;letter-spacing:.03em;
  text-shadow:0 3px 0 #a8701a,0 6px 0 #5a3508,0 0 24px rgba(243,203,100,.6)}
.ti-sub{margin-top:10px;font-size:13px;color:#cfc6ff;opacity:.9}
.ti-mons{position:relative;display:flex;gap:18px}
.ti-mons span{width:54px;height:54px;display:block;animation:tiBob 1.6s ease-in-out infinite}
.ti-mons span:nth-child(2){animation-delay:.25s}.ti-mons span:nth-child(3){animation-delay:.5s}
.ti-mons svg{width:100%;height:100%}
.ti-start{position:relative;border:2px solid var(--gold);background:linear-gradient(180deg,#ff8eab,#d64a72);color:#fff;font-family:var(--display);font-weight:900;font-size:17px;
  letter-spacing:.06em;padding:12px 28px;border-radius:999px;box-shadow:0 4px 0 #7a2346,0 0 18px rgba(255,142,171,.55);animation:tiBlink 1.4s ease-in-out infinite;cursor:pointer}
.ti-ver{position:absolute;bottom:18px;color:#8f86b8;font-size:11px}
@keyframes tiPulse{50%{opacity:.55}}
@keyframes tiBob{50%{transform:translateY(-8px)}}
@keyframes tiBlink{50%{transform:scale(1.05);box-shadow:0 4px 0 #7a2346,0 0 28px rgba(255,142,171,.85)}}
@keyframes tiDrop{from{transform:translateY(-40px) scale(.8);opacity:0}}
.vn{position:absolute;inset:0;z-index:58;background:radial-gradient(circle at 50% 35%,#2b3a7a,#0b1130 70%);cursor:pointer;overflow:hidden}
.vn-bg{position:absolute;inset:0;transition:background .4s;overflow:hidden}
.vn-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.35))}
.vn-deco{position:absolute;right:8%;top:14%;font-size:72px;opacity:.28;filter:blur(.5px)}
.vn-place{position:absolute;top:12px;left:12px;z-index:3;padding:5px 12px;border-radius:999px;background:rgba(8,12,34,.75);border:1.5px solid rgba(243,203,100,.6);color:#fff3c4;font-size:12px;font-weight:800;opacity:0}
.vn-place.show{animation:placeIn 2.6s ease forwards}
@keyframes placeIn{0%{opacity:0;transform:translateY(-6px)}12%,75%{opacity:1;transform:none}100%{opacity:.55}}
.vn-skip{position:absolute;top:12px;right:12px;z-index:3;border:1.5px solid rgba(255,255,255,.4);background:rgba(0,0,0,.4);color:#fff;border-radius:999px;padding:6px 12px;font-weight:800;font-size:12px}
.vn-art{position:absolute;bottom:56px;width:84%;max-width:390px;transition:left .25s,right .25s;pointer-events:none;z-index:1}
.vn-emote{position:absolute;z-index:2;top:4%;right:16%;width:16%;max-width:62px;aspect-ratio:1;opacity:0;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.vn-emote svg{width:100%;height:100%;display:block}
.vn-art.right .vn-emote{right:auto;left:16%}
.vn-art.pxs .vn-emote{top:-2%;right:8%}.vn-art.pxs.right .vn-emote{right:auto;left:8%}
.vn-emote.show{animation:emoteIn .35s cubic-bezier(.3,1.6,.5,1) forwards}
.vn-emote.show.e-gloom{animation:emoteIn .35s ease-out forwards, gloomDrift 2s ease-in-out .35s infinite}
.vn-emote.show.e-anger{animation:emoteIn .3s cubic-bezier(.3,1.6,.5,1) forwards, angerPulse .6s ease-in-out .3s infinite}
.vn-emote.show.e-sweat{animation:emoteIn .35s ease-out forwards, sweatSlide 1.8s ease-in .35s infinite}
.vn-emote.show.e-zzz,.vn-emote.show.e-note{animation:emoteIn .35s ease-out forwards, floatUp 1.8s ease-in-out .35s infinite}
@keyframes emoteIn{from{opacity:0;transform:scale(.3) translateY(10px)}to{opacity:1;transform:none}}
@keyframes angerPulse{50%{transform:scale(1.18)}}
@keyframes sweatSlide{0%{transform:none}80%{transform:translateY(8px)}100%{transform:translateY(8px);opacity:.4}}
@keyframes floatUp{50%{transform:translateY(-6px)}}
@keyframes gloomDrift{50%{transform:translateY(3px);opacity:.75}}
.vn-art.pxs{bottom:110px;width:70%}
.vn-art.glow{filter:drop-shadow(0 0 18px rgba(255,240,180,.75))}
.vn-art.left{left:-6%}.vn-art.right{right:-6%}
.vn-art img,.vn-art svg,.vn-art .lilia-stack{width:100%;height:auto;display:block;image-rendering:pixelated}
.vn-box{position:absolute;z-index:2;left:10px;right:10px;bottom:20px;min-height:140px;padding:20px 16px 14px;border-radius:14px;border:2px solid var(--gold);background:linear-gradient(180deg,#141e4a,#080c22);box-shadow:0 0 0 4px rgba(10,16,40,.6)}
.vn-box p{margin:0;font-size:15.5px;line-height:1.55}.vn-box p.narr{font-style:italic;color:#c9d0f2;text-align:center}
.vn-box .tap{position:absolute;right:14px;bottom:8px;color:var(--gold);animation:bob 1s ease-in-out infinite}
.vn-ch{display:flex;flex-direction:column;gap:8px;margin-top:10px}.vn-ch:empty{display:none}
@keyframes bob{50%{transform:translateY(3px)}}
.board{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);gap:3px;aspect-ratio:1;margin:6px 0}
.cell{position:relative;display:grid;place-items:center;border-radius:7px;font-size:clamp(14px,4.6vw,20px);background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15)}
.cell.c-start{background:color-mix(in srgb,var(--ev) 45%,transparent);border-color:var(--ev)}
.cell.c-chest{border-color:#ffd166}.cell.c-back{background:rgba(255,111,111,.15)}.cell.c-die{background:rgba(127,216,255,.15)}
.cell.here{box-shadow:0 0 0 2px #fff,0 0 12px var(--ev);z-index:2}
.token{position:absolute;inset:-30% -10% auto;display:grid;place-items:center;animation:pop .2s ease-out;pointer-events:none}
img.px.tok{width:130%;max-width:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.8))}
.bcenter{grid-column:2/7;grid-row:2/7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:12px;background:radial-gradient(circle,color-mix(in srgb,var(--ev) 25%,transparent),transparent 70%)}
.dicecount{font-size:18px;font-weight:900}.dicecount small{display:block;font-size:10.5px;text-align:center;color:#c9d0f2;font-weight:700}
.die{font-size:46px;line-height:1}.die.rolled{animation:pop .3s ease-out}
.bcenter .gbtn{width:auto;padding-left:26px;padding-right:26px}
.lapnow{font-size:11px;color:#c9d0f2}
.laps{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 6px}
.lapr{flex:0 0 auto;width:84px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:10px;border:1.5px solid rgba(243,203,100,.35);background:rgba(0,0,0,.25);text-align:center}
.lapr small{font-size:9.5px;font-weight:900;color:var(--gold);letter-spacing:.08em}.lapr b{font-size:20px}.lapr span{font-size:10px;line-height:1.2}
.lapr em{font-style:normal;font-size:8.5px;font-weight:900;color:#ff9db4;letter-spacing:.06em}
.lapr.got{opacity:.5;border-color:#7ff0b0}.lapr.got::after{content:"✔";color:#7ff0b0;font-weight:900}
img.px.lapico{width:28px;height:28px}

.advmenu{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.advcard{position:relative;border-radius:16px;border:2px solid rgba(243,203,100,.6);color:var(--cream);overflow:hidden;box-shadow:0 6px 14px rgba(0,0,0,.45)}
.advcard.big{display:flex;align-items:center;gap:14px;min-height:112px;padding:16px;text-align:left}
.advcard.story{background:linear-gradient(120deg,#3a2a7c,#1b2257 55%,#0f1538),radial-gradient(circle at 85% 20%,rgba(255,224,140,.35),transparent 60%);background-blend-mode:screen}
.advcard.event{border-color:var(--ev);background:linear-gradient(120deg,color-mix(in srgb,var(--ev) 55%,#1b2257),#141a44 70%)}
.ac-ico{font-size:46px;line-height:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.ac-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.ac-txt small{font-size:10.5px;font-weight:900;letter-spacing:.14em;color:var(--gold)}
.ac-txt b{font-family:var(--display);font-size:20px;line-height:1.15}
.ac-txt em{font-style:normal;font-size:12.5px;color:#c9d0f2}
.ac-badge{position:absolute;top:10px;right:10px;padding:3px 9px;border-radius:999px;background:#ff6f91;color:#fff;font-size:11px;font-weight:900;box-shadow:0 0 10px rgba(255,111,145,.6)}
.advrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.advcard.small{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 8px 12px;min-height:132px}
.advcard.hunt{background:linear-gradient(160deg,#7a2a3a,#2a1430)}
.advcard.gather{background:linear-gradient(160deg,#2a6a40,#13301f)}
.advcard.small b{font-family:var(--display);font-size:18px}.advcard.small em{font-style:normal;font-size:11.5px;color:#d7dcf5}
img.px.advmon{width:64px;height:64px}
.advcard:active{transform:scale(.98)}
.advback{align-self:flex-start;width:auto;margin-bottom:-4px}

.frame.exam{border-color:#ffd166;background:linear-gradient(180deg,rgba(255,209,102,.16),rgba(0,0,0,.25))}
.frame.exam p{margin:0 0 8px;font-size:13.5px;line-height:1.45;text-align:center}
.exbar{display:grid;grid-template-columns:62px 1fr 52px;gap:8px;align-items:center;font-size:12px;margin:4px 0}
.exbar b{text-align:right}.exbar .xpbar{width:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- Guild hall backdrop -->

  <!-- HUD -->

      <div class="portrait-sm" id="hudPortrait"></div>
      <div style="min-width:0">
        <div class="pname" id="advName">Adventurer</div>
        <div class="rankline">LV <b id="lvText">1</b></div>
        <div class="xpbar" title="EXP"><i id="xpBar" style="width:0%"></i></div>
