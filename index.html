<script>
/* ---------- constants ---------- */
const RANKS = {E:{xp:10,gold:5},D:{xp:20,gold:10},C:{xp:35,gold:18},B:{xp:55,gold:30},A:{xp:80,gold:45},S:{xp:120,gold:70}};   // S = story quests
const STARS = {E:1,D:2,C:3,B:4,A:5,S:6};

const GREETINGS = [
  "Welcome back! The board's freshly posted. Pick a notice and I'll stamp it when you bring proof.",
  "Ah, there you are! The guild master's been asking about you. Anything on the board catch your eye?",
  "Good to see you! Remember, photo quests need proof. No proof, no pay!",
  "Morning shift's quiet today… perfect time to clear a few quests, don't you think?",
  "Oh! You're just in time. Some fresh requests came in."
];
const POKES = [
  "Hm? Did you need something? The quest board's right over there!",
  "Hey! No poking the receptionist. That's in the guild rules. Page four.",
  "Between you and me, the guild master can't cook. Don't tell him I said that.",
  "If you clear enough quests, maybe I'll put in a good word for your rank-up~",
  "I've been sorting request forms all day. My stamp hand is SO tired.",
  "Every quest you clear makes the guild look good. And me too, honestly!",
  "Do you want a cup of tea? …Oh, right, you're on the other side of the screen."
];
const STARTERS = [
  {title:"Wash the dishes",rank:"D",cat:"household",size:"medium",repeat:"daily",proof:"photo"},
  {title:"Make the bed",rank:"E",cat:"household",size:"quick",repeat:"daily",proof:"photo"},
  {title:"Drink a full bottle of water",rank:"E",cat:"selfcare",size:"quick",repeat:"daily",proof:"honour"},
  {title:"Take the bins out",rank:"D",cat:"outside",size:"quick",repeat:"weekly",proof:"photo"},
  {title:"Laundry: wash, dry and fold one load",rank:"C",cat:"household",size:"big",repeat:"weekly",proof:"photo"}
];
/* What a proof photo must show, so it can't be faked with a scene that looks the same whether or not the chore got done.
   Shown when reporting, sent to the AI check and the Guild Inspector. Custom quests get one from Lilia's AI sorting. */
const PROOF_SHOT = {
  "wash the dishes": "Clean dishes on the drying rack, or freshly washed dishes next to an empty sink",
  "make the bed": "Your made bed",
  "take the bins out": "The bin out at the kerb or collection point",
  "laundry: wash, dry and fold one load": "Washing hanging on a line or drying rack, a load in the dryer, or a freshly folded pile. Not clothes already put away in a wardrobe or drawer",
  "fold and put away a pile of clothes": "The freshly folded pile, before it goes away",
  "hang out or move a load of washing": "Washing hanging on a line or drying rack, or a load inside the dryer",
  "change your bed sheets": "The old sheets in the wash pile or machine, or the bed mid-change",
  "put away all the clean dishes": "The empty drying rack or dishwasher, with the dishes put away",
  "take out the recycling": "The recycling bin out, or the full bag going in",
  "empty every bin in the house": "The emptied bins, or the full bags taken out",
  "clean out the fridge": "The cleared fridge shelves, or the old food you threw out",
  "prep tomorrow's lunch": "The packed lunch",
  "water the plants": "The plants with wet soil, or the watering can in action",
  "wash your water bottle": "The bottle being washed or drying upside down"
};
const shotFor = q => q && q.proof!=="honour" ? (q.shot || PROOF_SHOT[(q.title||"").trim().toLowerCase()] || "") : "";
const COIN = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f3cb64" stroke="#a8771f" stroke-width="2"/><circle cx="12" cy="12" r="6" fill="none" stroke="#a8771f" stroke-width="1.5"/><path d="M12 8v8" stroke="#a8771f" stroke-width="2"/></svg>`;
const ORB = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#7fd8ff" stroke="#2a7fb8" stroke-width="2"/><path d="M12 5l2 5h5l-4 3 1.6 5L12 15l-4.6 3L9 13 5 10h5z" fill="#fff"/></svg>`;

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2,"0");
const dayKey = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const weekKey = (d=new Date()) => { const x=new Date(d); const wd=(x.getDay()+6)%7; x.setDate(x.getDate()-wd); return dayKey(x); };
/* slow, guild-like levelling: ranks need LV 5 / 10 / 20 / 35 / 50 / 65 (see rank.js) */
const xpNeeded = lvl => lvl<=4 ? [60,150,330,560][lvl-1] : lvl<10 ? 550 : lvl<20 ? 605 : lvl<35 ? 880 : lvl<50 ? 1760 : 1980;
function levelInfo(total){ let lvl=1, rest=total; while(rest >= xpNeeded(lvl)){ rest -= xpNeeded(lvl); lvl++; } return {lvl, into:rest, need:xpNeeded(lvl)}; }
function guildRank(){ return Rank.cur(); }   // rank is earned through exams, not just levels
function reward(rank, proof){ const r=RANKS[rank]||RANKS.E; const f = proof==="honour" ? .5 : 1; return {xp:Math.round(r.xp*f), gold:Math.round(r.gold*f*Rank.bonus())}; }
const pick = a => a[Math.floor(Math.random()*a.length)];
const tilt = id => { let h=0; for(const c of String(id)) h=(h*31+c.charCodeAt(0))|0; return ((Math.abs(h)%7)-3)*0.9; };
const stars = r => "★".repeat(STARS[r]||1);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- state ---------- */
function freshState(){
  return { name:"Adventurer", xp:0, gold:0, completed:0,
    quests: STARTERS.map(q => ({...q, id:uid()})),
    done:{}, active:{}, bounties:{date:"", list:[]}, log:[], inspector:{}, pending:{} };
}
let state = freshState();
let tab = "home";
let ref = null, writing = false, dirty = false;

let wiping = false;   // set while deleting data, so nothing re-saves before the reload
function saveLocal(){ if(wiping) return; try{ localStorage.setItem("guild-save", JSON.stringify(state)); }catch(e){} }
let notifSyncT = 0;
async function save(){
  saveLocal();
  clearTimeout(notifSyncT); notifSyncT = setTimeout(() => { try{ Notify.sync(); }catch(e){} }, 1500);   // keep due-date alerts in step with quests
  if(!ref) return;
  dirty = true;
  if(writing) return;
  writing = true;
  while(dirty){
    dirty = false;
    try{ await ref.set(JSON.parse(JSON.stringify(state))); }
    catch(e){ if(e && e.code==="unavailable"){ await new Promise(r=>setTimeout(r,800+Math.random()*800)); try{ await ref.set(JSON.parse(JSON.stringify(state))); }catch(_){} } else { setStatus("Couldn't save to the guild records. Progress is kept on this device for now."); } }
  }
  writing = false;
}
let statusText = "Loading your guild file…";
function setStatus(t){ statusText = t; if(tab==="settings") render(); }
let typeTimer = null;
function say(t){
  const el = $("lilia"); clearInterval(typeTimer);
  if(typeof Lilia!=="undefined") Lilia.talk(reduceMotion ? 900 : Math.min(6000, t.length*11+200));
  if(reduceMotion){ el.textContent = t; return; }
  let i = 0; el.textContent = "";
  typeTimer = setInterval(() => { i += 2; el.textContent = t.slice(0,i); if(i >= t.length) clearInterval(typeTimer); }, 22);
}
function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("show"),2400); }

/* ---------- availability & scheduling ---------- */
const DAYN = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function poolPicks(){
  const pool = state.quests.filter(q=>q.repeat==="pool").map(q=>q.id).sort();
  const n = Math.min(pool.length, state.poolPerDay||2);
  let s=0; for(const c of dayKey()+"pool") s=(s*31+c.charCodeAt(0))>>>0;
  const rnd=()=>{ s=(s*1103515245+12345)>>>0; return (s>>>8)/16777216; };
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  return new Set(pool.slice(0,n));
}
function isAvailable(q){
  const d = state.done[q.id], today = dayKey();
  switch(q.repeat){
    case "daily": return !d || d.day !== today;
    case "weekly": return hasDueDay(q) ? (!d || d.cycle !== weeklyDue(q)) : (!d || d.week !== weekKey());
    case "days": return (q.days||[]).includes(new Date().getDay()) && (!d || d.day !== today);
    case "pool": return poolPicks().has(q.id) && (!d || d.day !== today);
    default: return !d;   // once, due
  }
}
const isOverdue = q => q.repeat==="due" && q.due && q.due < dayKey();
/** Weekly quests can have a due weekday (e.g. bin day = Tuesday). Each cycle runs from the day after one due day to the next. */
const hasDueDay = q => q.repeat==="weekly" && q.dueDay!=null && q.dueDay!=="";
function weeklyDue(q, from=new Date()){ const x=new Date(from); x.setHours(12,0,0,0); x.setDate(x.getDate()+((+q.dueDay - x.getDay() + 7) % 7)); return dayKey(x); }
/** The date a quest has to be done by, if it has one (and isn't done yet for this cycle) */
function deadlineOf(q){
  if(q.repeat==="due" && q.due && !state.done[q.id]) return q.due;
  if(hasDueDay(q) && isAvailable(q)) return weeklyDue(q);
  return null;
}
const dueToday = q => deadlineOf(q)===dayKey();
function fmtDate(k){ const [y,m,d]=k.split("-").map(Number); const dt=new Date(y,m-1,d); return `${DAYN[dt.getDay()]} ${d} ${dt.toLocaleString("en-AU",{month:"short"})}`; }
function repeatTxt(q){
  if(q.bounty) return "Today only";
  switch(q.repeat){
    case "daily": return "Daily";
    case "weekly": return hasDueDay(q) ? (weeklyDue(q)===dayKey() ? "Weekly · due today!" : `Weekly · due ${DAYN[+q.dueDay]}`) : "Weekly";
    case "days": return (q.days||[]).slice().sort((a,b)=>((a+6)%7)-((b+6)%7)).map(d=>DAYN[d]).join(", ") || "No days set";
    case "pool": return "Random pool";
    case "due": return q.due ? (isOverdue(q) ? `Overdue (${fmtDate(q.due)})` : `Due ${fmtDate(q.due)}`) : "One-time";
    default: return "One-time";
  }
}
function todaysBounties(){ return state.bounties && state.bounties.date===dayKey() ? state.bounties.list : []; }
function findQuest(id){ return state.quests.find(q=>q.id===id) || todaysBounties().find(b=>b.id===id); }
function activeList(){ return [...state.quests, ...todaysBounties()].filter(q => state.active[q.id] && (q.bounty ? !q.done : isAvailable(q))); }

/* ---------- rendering ---------- */
let hudLookKey = "";
function headSVG(){
  const h = state.hero;
  if(!h || !h.created) return `<svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="4.5" fill="#c9d2ff"/><path d="M3 22c1-5 5-7 9-7s8 2 9 7z" fill="#c9d2ff"/></svg>`;
  return pic(heroPortrait(), "head");
}
function renderHUD(){
  const li = levelInfo(state.xp);
  $("advName").textContent = state.name || "Adventurer";
  $("lvText").textContent = li.lvl;
  $("xpBar").style.width = Math.min(100, li.into/li.need*100) + "%";
  ensureParty(); $("crysText").textContent = (state.crystals||0).toLocaleString();
  $("goldText").textContent = state.gold.toLocaleString();
  const key = JSON.stringify(state.hero && state.hero.created ? [state.hero.look, state.hero.weapon] : 0);
  if(key !== hudLookKey){ hudLookKey = key; $("hudPortrait").innerHTML = headSVG(); }
  const n = activeList().length, open = state.quests.filter(q=>!state.active[q.id]&&isAvailable(q)).length;
  $("aBadge").hidden = !(n||open); $("aBadge").textContent = n ? n : open;
}
const qReward = q => q.tut ? {xp:10, gold:100} : reward(qRank(q), q.proof);
const cryFor = q => q.tut ? 220 : Math.round(({E:5,D:8,C:12,B:16,A:20,S:30}[qRank(q)]||5) * (q.proof==="honour"?.5:1) * Rank.bonus());
function notice(q){
  const r = qReward(q), od = isOverdue(q);
  const head = q.story ? "📜 STORY QUEST" : q.bounty ? "★ BOUNTY" : od ? "⚠ OVERDUE" : q.repeat==="due" ? "⏰ DUE " + fmtDate(q.due).toUpperCase() : q.repeat==="pool" ? "✦ RANDOM PICK" : "REQUEST";
  return `<button class="notice ${q.bounty?'bounty':''} ${q.story?'storyq':''} ${od?'overdue':''}" style="--r:${tilt(q.id)}deg" data-act="open" data-id="${q.id}">
    <span class="stamp c-${qRank(q)}">${qRank(q)}</span>
    <span class="nh">${head}${q.cat&&CATS[q.cat]?" · "+CATS[q.cat].i:""}</span>
    <span class="ns">${stars(qRank(q))}</span>
    <span class="nt">${esc(q.title)}</span>
    <span class="nr"><span>${r.xp} EXP · ${r.gold} G · ${cryFor(q)}💎</span><span>${q.proof==="photo"?"📸":"🤝"}</span></span>
  </button>`;
}
let boardTab = "quests";
function renderBoard(){
  const tabs = [["quests","Quests"],["supplies","Hunt & Gather"],["mine","📌 Post"]];
  let body = "";
  if(boardTab==="supplies") body = renderSupplies();
  else if(boardTab==="mine") body = renderPostings();
  else {
    const active = activeList();
    const open = state.quests.filter(q => !state.active[q.id] && isAvailable(q)).sort((a,b)=>(!!b.story-!!a.story) || (isOverdue(b)-isOverdue(a)) || (dueToday(b)-dueToday(a)));
    const bounties = todaysBounties().filter(b => !state.active[b.id] && !b.done);
    const asked = state.bounties && state.bounties.date===dayKey();
    const rows = active.map(q => { const r=qReward(q); return `
      <button class="row" data-act="open" data-id="${q.id}"><span class="gem r-${qRank(q)}">${qRank(q)}</span>
        <span>${esc(q.title)}<small>${pendingFor(q.id)?"⏳ Waiting for your Guild Inspector":q.proof==="photo"?"📸 Bring photo proof":"🤝 Trust quest: report it yourself"} · ${repeatTxt(q)}</small></span>
        <span class="rt">${r.xp} EXP<small>${r.gold} G · ${cryFor(q)} 💎</small></span></button>`; }).join("");
    body = `${Tut.boardCard()}${Rank.boardCard()}${LostBoot.boardCard()}
      <section class="frame"><span class="ribbon">QUEST LOG</span>
        ${rows || `<div class="none">No quests accepted yet. Take a notice from the board below!</div>`}</section>
      <section class="frame" id="boardFrame"><span class="ribbon">QUEST BOARD</span>
        <div class="cork"><div class="notices">
          ${open.map(notice).join("")}
          ${bounties.map(notice).join("")}
          ${!open.length && !bounties.length ? `<div class="board-empty">Board cleared! Repeating notices go back up when they're due.</div>` : ""}
        </div></div>
        <div class="btns" style="margin-top:14px">
          ${asked ? "" : `<button class="gbtn" data-act="bounties">★ Ask Lilia for today's bounties</button>`}
        </div>
      </section>`;
  }
  return `<div class="boardhead"><div class="subtabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" class="${boardTab===k?'on':''}" aria-selected="${boardTab===k}" data-act="boardTab" data-v="${k}">${l}</button>`).join("")}</div>
    <button class="xbtn" data-act="closeBoard" aria-label="Back to the guild hall">✕</button></div>${body}`;
}
function renderLibrary(){
  const mins = d => Focus.minutes(d), today=dayKey();
  let week=0; for(let i=0;i<7;i++){ const t=new Date(); t.setDate(t.getDate()-i); week+=mins(`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`); }
  const cleared=(state.log||[]).filter(l=>l.date===today).length, due=(state.quests||[]).filter(q=>q.repeat==="due"&&q.due>=today).length;
  const card = (act,v,i,n,d,extra) => `<button class="libcard" data-act="${act}" ${v?`data-v="${v}"`:""}><span class="li-i">${i}</span><span><b>${n}</b><small>${d}</small>${extra?`<em>${extra}</em>`:""}</span><span class="li-go">›</span></button>`;
  return `<div class="boardhead"><div class="libtitle">📚 Library</div><button class="xbtn" data-act="closeBoard" aria-label="Back to the guild hall">✕</button></div>
    <section class="frame"><span class="ribbon">STUDY &amp; TOOLS</span>
      <div class="libcards">
        ${card("focus","","⏱️","Focus timer","Pomodoro or countdown, with focus music", Focus.running?"⏳ A timer is running":"")}
        ${card("journal","diary","📖","Journal","Your diary, study notes and quest log", D_COUNT())}
        ${card("journal","cal","📅","Calendar","Due dates and what you did each day", due?`📌 ${due} quest${due>1?"s":""} with a due date`:"")}
      </div></section>
    <section class="frame"><span class="ribbon">TODAY</span>
      <div class="tiles"><div><b>${cleared}</b><span>Quests today</span></div><div><b>${mins(today)}</b><span>Focus min</span></div><div><b>${week}</b><span>Focus this week</span></div></div></section>`;
}
const D_COUNT = () => { const n=(state.diary||[]).length; return n?`${n} entr${n>1?"ies":"y"} written`:""; };
function renderPostings(){
  const groups = [["Repeating",q=>["daily","weekly","days"].includes(q.repeat)],["Random pool",q=>q.repeat==="pool"],["One-time & due dates",q=>!q.repeat||q.repeat==="once"||q.repeat==="due"]];
  const row = q => `<div class="row"><span class="gem r-${qRank(q)}">${qRank(q)}</span>
      <span>${esc(q.title)}<small><span class="stars">${stars(qRank(q))}</span> · ${q.cat&&CATS[q.cat]?CATS[q.cat].i+" "+SIZES[q.size].n:"⚠ tap Edit to set its type"} · ${esc(repeatTxt(q))} · ${q.proof==="photo"?"Photo":"Trust"}</small></span>
      <button class="mini edit" data-act="postEdit" data-id="${q.id}">Edit</button></div>`;
  const poolN = state.quests.filter(q=>q.repeat==="pool").length;
  return `<section class="frame"><span class="ribbon">POST A QUEST</span>
    <p class="note" style="margin:0 0 8px;text-align:center">Turn any real-life task into a quest. Lilia will rank it for you.</p>

const normTitle = t => String(t).toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w && !["a","an","the","my","do","take","have","go","some","to"].includes(w)).join(" ");
function userQuests(except){ return state.quests.filter(q=>!q.tut && !q.bounty && !q.story && q.id!==except); }
function localDupe(title, except){ const n=normTitle(title); return n ? (userQuests(except).find(q=>normTitle(q.title)===n)||null) : null; }
async function pfAskLilia(btn){
  syncPost(); const d=postDraft;
  if(!d.title.trim()){ toast("Write the quest name first."); return; }
  if(d.repeat==="days" && !d.days.length){ toast("Pick at least one day."); return; }
  const b = btn || $("pfNext"); if(b){ b.disabled=true; b.textContent="Lilia is thinking…"; }
  try{
    const r = await aiSortQuest(d.title, userQuests(d.id));
    d.cat=r.cat; d.size=r.size; d.reason=r.reason||""; d.proof=r.proof; d.shot=r.shot||""; d.ai={cat:r.cat, size:r.size, proof:r.proof};
    const dup = (r.dupeOf && state.quests.find(q=>q.id===r.dupeOf)) || localDupe(d.title, d.id);
    d.dupe = dup && !d.id ? dup.id : null; d.replace = null;
    if(d.stage==="write") d.stage = d.dupe ? "dupe" : "confirm";
    drawPostForm();
  }catch(err){
    toast(err.message||"Lilia couldn't sort that one. Pick a type and size yourself.");
    if(d.stage==="write") d.stage="full"; drawPostForm();
  }
}
function syncPost(){
  if(!postDraft) return;
  const t=$("pfTitle"); if(t) postDraft.title=t.value;
  const du=$("pfDue"); if(du) postDraft.due=du.value;
}
function savePost(){
  syncPost(); const d=postDraft; if(!d) return;
  const title=d.title.trim(); if(!title){ toast("Give the quest a name first."); return; }
  if(d.repeat==="days" && !d.days.length){ toast("Pick at least one day."); return; }
  if(!d.cat || !d.size){ toast("Pick a type and a size so Lilia can rank it."); return; }
  if(!d.id && !d.ai && !d.dupeChecked){ d.dupeChecked=true; const dup=localDupe(title); if(dup){ d.dupe=dup.id; d.stage="dupe"; drawPostForm(); return; } }
  if(d.repeat==="due" && !d.due) d.due=dayKey();
  if(d.repeat==="due" || (d.repeat==="weekly" && d.dueDay!=null)) Notify.ensure("due");
  if(d.ai && d.ai.proof==="honour") d.proof="honour";
  if(d.replace){ state.quests = state.quests.filter(x=>x.id!==d.replace); delete state.active[d.replace]; if(state.done) delete state.done[d.replace]; if(state.pending) delete state.pending[d.replace]; }
  const data={title, cat:d.cat, size:d.size, rank:rankFor(d.cat,d.size)||"D", proof:d.proof, repeat:d.repeat, days:d.repeat==="days"?d.days:undefined, due:d.repeat==="due"?d.due:undefined, dueDay:d.repeat==="weekly"&&d.dueDay!=null?d.dueDay:undefined,
              ai: d.ai ? {...d.ai} : undefined, shot: d.shot || undefined};
  if(d.id){ const q=state.quests.find(x=>x.id===d.id); if(q){ Object.assign(q,data); if(!q.days) delete q.days; if(!q.due) delete q.due; if(q.dueDay==null) delete q.dueDay; if(!q.ai) delete q.ai; if(!q.shot) delete q.shot; } toast("Quest updated!"); }
  else { const q={id:uid(), ...data}; if(!q.days) delete q.days; if(!q.due) delete q.due; if(!q.ai) delete q.ai; state.quests.push(q);
    const t=`"${title}"`, up=isAvailable(q);
    const filed = q.repeat==="pool" ? `Quest accepted! I've filed ${t} in the random pool. Some mornings I'll draw it for the board~`
      : q.repeat==="days" ? `Quest accepted! I've filed ${t} away. I'll pin it up every ${q.days.slice().sort((a,b)=>((a+6)%7)-((b+6)%7)).map(i=>DAYN[i]).join(", ")}.`
      : `Quest accepted! I've filed ${t} away until it's due again.`;
    const posted = q.repeat==="daily" ? `Quest accepted! ${t} is on the board, and I'll pin up a fresh one every day.`
      : q.repeat==="weekly" ? `Quest accepted! ${t} is on the board. Clear it once each week!`
      : q.repeat==="due" ? `Quest accepted! ${t} is on the board. Due by ${fmtDate(q.due)}.`
      : q.repeat==="pool" ? `Quest accepted! I've put ${t} in the random pool, and I drew it for today's board!`
      : `Quest accepted! ${t} is pinned to the board. Good luck out there~`;
    toast(up ? "📌 Quest posted!" : "🗂️ Quest filed away!"); say(up ? posted : filed); }
  postDraft=null; save(); closeModal(); render();
}

/* ---------- privacy strikes ----------
   Face in a proof photo = a strike. 3+ strikes: face photos are rejected. 5+ strikes: rewards -20%.
   Every 7 different days of clearing quests without a face photo removes 2 strikes (gradual decay). */
const STRIKE_REJECT = 3, STRIKE_PENALTY = 5, CLEAN_DAYS = 7, STRIKE_DECAY = 2;
function privacy(){ return state.privacy || (state.privacy = {strikes:0, clean:[]}); }
function addStrike(){ const p=privacy(); p.strikes++; p.clean=[]; save(); return p.strikes; }
const strikePenalty = () => privacy().strikes >= STRIKE_PENALTY ? .8 : 1;
function noteCleanDay(){
  const p=privacy(); if(!p.strikes) return;
  const d=dayKey(); if(!p.clean.includes(d)) p.clean.push(d);
  if(p.clean.length >= CLEAN_DAYS){ const hadPen = p.strikes>=STRIKE_PENALTY; p.strikes=Math.max(0, p.strikes-STRIKE_DECAY); p.clean=[];
    const left=p.strikes, back = hadPen && left<STRIKE_PENALTY;
    setTimeout(()=>{ toast(left ? `🧼 −${STRIKE_DECAY} privacy strikes (${left} left)` : "🧼 Privacy strikes cleared!");
      say(`A whole week of face-free proof! ${left ? `I've taken ${STRIKE_DECAY} strikes off, you're down to ${left}.` : "Your privacy strikes are all cleared~"}${back ? " And your full rewards are back!" : ""}`); }, 4500); }
}
function strikeLine(){
  const p=privacy(); if(!p.strikes) return "";
  return `<div class="verdict ${p.strikes>=STRIKE_PENALTY?"no":"wait"}" style="margin-top:10px">⚠️ Privacy strikes: <b>${p.strikes}</b>${p.strikes>=STRIKE_PENALTY?" · rewards −20%":p.strikes>=STRIKE_REJECT?" · face photos now get rejected":""}.
    Clear quests on ${CLEAN_DAYS-p.clean.length} more day(s) without face photos to remove ${Math.min(STRIKE_DECAY,p.strikes)}.</div>`;
}

function countUp(el, to){
  if(reduceMotion){ el.textContent = "+"+to; return; }
  const t0 = performance.now(), dur = 700;
  (function f(t){ const p = Math.min(1,(t-t0)/dur); el.textContent = "+" + Math.round(to*p); if(p<1) requestAnimationFrame(f); })(t0);
}

const STUDY_NOTE_MIN = 10;   // characters needed in a study note for the +10% bonus
async function grant(q, verified, method, opts={}){
  const before = levelInfo(state.xp).lvl;
  const r = q.tut ? {xp:10, gold:100} : reward(qRank(q), verified ? "photo" : "honour");
  let cry = q.tut ? 220 : cryFor(q);
  const pen = q.tut ? 1 : strikePenalty();
  if(pen<1){ r.xp=Math.round(r.xp*pen); r.gold=Math.round(r.gold*pen); cry=Math.round(cry*pen); }
  const studyNote = (opts.note||"").trim().length >= STUDY_NOTE_MIN;
  if(studyNote){ r.xp=Math.round(r.xp*1.1); r.gold=Math.round(r.gold*1.1); }
  if(!q.tut && !opts.face) noteCleanDay();
  if(!q.tut){ Rank.onClear(!!verified); const ad=state.activeDays||(state.activeDays=[]), dk=dayKey(); if(!ad.includes(dk)) ad.push(dk); }
  if(q.tut && state.tut) state.tut.claimed = true;
  noteClear(q);
  state.xp += r.xp; state.gold += r.gold; state.completed += 1; state.crystals = (state.crystals||0) + cry;
  if(q.bounty){ q.done = true; }
  else if(!q.repeat || q.repeat==="once" || q.repeat==="due"){ state.quests = state.quests.filter(x=>x.id!==q.id); }
  else { state.done[q.id] = {day:dayKey(), week:weekKey(), cycle: hasDueDay(q) ? weeklyDue(q) : undefined}; }
  delete state.active[q.id];
  const nt = (opts.note||"").trim() ? Journal.addNote(opts.note, {kind:"study", quest:q.title}) : null;
  const tm = new Date(); const time = `${String(tm.getHours()).padStart(2,"0")}:${String(tm.getMinutes()).padStart(2,"0")}`;
  state.log.unshift({title:q.title, date:dayKey(), time, cat:q.cat, xp:r.xp, gold:r.gold, v:!!verified, m:method||(verified?"ai":"honour"), nid:nt?nt.id:undefined});
  if(state.pending) delete state.pending[q.id];
  state.log = state.log.slice(0,1500);
  save(); render();
  const p = splash(`<div class="sp-title">QUEST<br>CLEAR!</div><div class="sp-sub">${esc(q.title)}</div>
    <div class="loot"><div>${ORB}<b id="lxp">+0</b><span>EXP</span></div><div>${COIN}<b id="lg">+0</b><span>GOLD</span></div><div>${PX.img(PX.icon("crystal"),"lootico")}<b>+${cry}</b><span>CRYSTALS</span></div></div>
    ${studyNote?`<div class="sp-sub" style="color:#9cf5c0;font-size:13px">📚 +10% study note bonus! Saved to your Journal.</div>`:""}
    ${pen<1?`<div class="sp-sub" style="color:#ff9b8f;font-size:13px">−20% rewards (privacy strikes). Keep clearing quests without face photos: every ${CLEAN_DAYS} clean days removes ${STRIKE_DECAY} strikes.</div>`:""}
    <div class="tap">Tap to continue</div>`, 4000);
  countUp($("lxp"), r.xp); countUp($("lg"), r.gold);
  await p;
  const after = levelInfo(state.xp).lvl;
  if(after > before){
    const promoted = false; Rank.checkEligible(before);
    await splash(`<div class="sp-title">${promoted?"RANK UP!":"LEVEL UP!"}</div>
      <div class="lv" style="width:90px;height:90px"><div><small style="font-size:12px">LV</small><b style="font-size:36px">${after}</b></div></div>
      <div class="sp-sub">${promoted?`You're now a ${guildRank(after)}-Rank Adventurer!`:`${guildRank(after)}-Rank Adventurer`}</div>
      <div class="tap">Tap to continue</div>`, 3500);
    say(promoted ? `Congratulations on your promotion to ${guildRank(after)}-Rank! I'll update your guild card right away!` : `Level ${after}! You're getting stronger every day.`);
  }
  if(q.story) Story.questDone(q.story);
}

function handleAct(b){
  const id = b.dataset.id, act = b.dataset.act, v = b.dataset.v;
  if(Tut.active() && (((act==="accept"||act==="report") && id!=="tut-register") || act==="postNew" || act==="postEdit" || act==="bounties")){
    toast("Finish Lilia's tutorial first! ✨"); return;
  }
  if(act.startsWith("fc-") && Focus.act(act, b)) return;
  if(act.startsWith("nt-")){ Notify.act(act, b); return; }
  if(act==="ad-watch"){ Ads.watch(); return; }
  if(act==="boot-deliver"){ closeModal(); LostBoot.deliver(); return; }
  if((act==="journal" || act.startsWith("jn-")) && Journal.act(act, b)) return;
  if(act==="focus"){ closeModal(); Focus.open(id); return; }
  if(act==="library"){ go("library"); return; }
  if(act.startsWith("g-")) return gameAct(b);
  if(act.startsWith("st-") && Story.act(act, v)) return;
  if(act.startsWith("ev-") && Ev.act(act)) return;
  if((act.startsWith("p-")||act==="pull") && partyAct(b)) return;
  if(act==="open"){ openNotice(id); }
  else if(act==="accept" && !state.rulesAgreed){ openRules(()=>handleAct(b)); }
  else if(act==="accept"){ state.active[id] = {at:Date.now()}; save(); closeModal(); render(); const q=findQuest(id); toast(`Accepted: ${q.title}`); say(`"${q.title}", accepted! Come back to me when it's done${q.proof==="photo"?" and bring a photo":""}.`); }
  else if(act==="abandon"){ delete state.active[id]; save(); closeModal(); render(); say("Dropped it? No penalty this time… but the board remembers. Just kidding! Mostly."); }
  else if(act==="report"){ openReport(id); }
  else if(act==="close"){ postDraft=null; closeModal(); setTimeout(()=>Tut.update(), 0); }
  else if(act==="bounties"){ fetchBounties(b); }
  else if(act==="openBoard"){ boardTab = v || "quests"; go("board"); }

  else if(act==="pfDay"){ syncPost(); const n=+v, a=postDraft.days; const i=a.indexOf(n); if(i>=0) a.splice(i,1); else a.push(n); drawPostForm(); }
  else if(act==="postDelete"){ state.quests = state.quests.filter(q=>q.id!==id); delete state.active[id]; delete state.done[id]; postDraft=null; save(); closeModal(); render(); toast("Quest removed."); }
  else if(act==="poolN"){ const n=state.quests.filter(q=>q.repeat==="pool").length; state.poolPerDay = Math.max(1, Math.min(n, (state.poolPerDay||2) + (+v))); save(); render(); }
  else if(act==="card"){ closeModal(); go("card"); if(b.dataset.v==="equip" && Tut.wantsEquip()) scrollToSec("secEquip", true); }
  else if(act==="settingsOpen"){ closeModal(); go("settings"); scrollToSec(v); }
  else if(act==="records"){ closeModal(); Journal.open("diary"); }
  else if(act==="sound"){ Music.toggle(); render(); }
  else if(act==="bgm"){ BGM.toggle(); render(); }
  else if(act==="off"){ Music.setOffset(Music.offset + (+v)); render(); }
  else if(act==="calStart"){ calStart(); }
  else if(act==="goSettings"){ closeModal(); go("settings"); scrollToSec(v); }
  else if(act==="tutClaim"){ Tut.claim(); }
  else if(act==="tutAI"){ adultGate(()=>Tut.aiPicker()); }
  else if(act==="aiUnlock"){ adultGate(()=>{ render(); scrollToSec("secAI", true); }); }
  else if(act==="tutTip"){ Tut.tip(); }
  else if(act==="tutStepBtn"){ Tut.stepBtn(); }
  else if(act==="tutNext"){ closeModal(); Tut.next(); }
  else if(act==="qz"){ QZ.ans[QZ.i]=+v; QZ.i++; drawQuiz(); }
  else if(act==="qzBack"){ QZ.i=Math.max(0,QZ.i-1); drawQuiz(); }
  else if(act==="quizStart"){ openQuiz(); }
  else if(act==="pfCat"){ syncPost(); postDraft.cat=v; drawPostForm(); }
  else if(act==="pfSize"){ syncPost(); postDraft.size=v; drawPostForm(); }
  else if(act==="pfSort"){ pfAskLilia(b); }

function openReport(id){
  const q = findQuest(id); if(!q) return;
  if(q.tut) return openTutReport(q);
  if(q.proof==="honour"){
    const study = q.cat==="study";
    openModal(`<span class="ribbon">REPORT</span><h3 class="t">${esc(q.title)}</h3>
      <div style="font-size:14px"><b style="color:var(--rose)">Lilia:</b> ${study?"A study quest! It's a trust quest, but tell me what you studied and I'll add a little bonus~":"This one's a trust quest, so I'll take your word for it. You really did it, right? I'll know if you didn't. (I won't. But the guild spirit will.)"}</div>
      ${study?`<button class="gbtn blue" data-act="focus" data-id="${q.id}">⏱️ Start a focus timer for this</button>
        <label class="studynote"><span>📚 What did you study? <small>(optional · +10% rewards · saved to your Journal)</small></span>
        <textarea id="studyNote" maxlength="2000" placeholder="e.g. Chapter 3 of my biology notes: how cells divide. Made 10 flashcards."></textarea>
        <small id="snHint" class="sn-hint">Write a little more to get the bonus.</small></label>`:""}
      <div class="btns"><button class="gbtn" id="honourYes">Yes, it's done</button>
      <button class="gbtn plain" data-act="close">Not yet</button></div>`);
    const sn=$("studyNote");
    if(sn) sn.oninput = () => { const ok=sn.value.trim().length>=STUDY_NOTE_MIN; $("snHint").textContent = ok?"✨ +10% bonus unlocked!":sn.value.trim()?"Write a little more to get the bonus.":"Write a little more to get the bonus."; $("snHint").classList.toggle("ok", ok); };
    $("honourYes").onclick = () => { const note=sn?sn.value:""; closeModal(); grant(q,false,undefined,{note}); say(note.trim().length>=STUDY_NOTE_MIN?"Ooh, look at you studying! I've tucked your notes into your journal~":"Stamped on trust. Thanks for keeping the guild's faith in you!"); };
    return;
  }
  const act = state.active[id] || (state.active[id] = {at:Date.now()});
  const pend = pendingFor(id);
  const aiOn = AI.ready(), insOn = inspectorReady();
  openModal(`<span class="ribbon">REPORT</span><h3 class="t">${esc(q.title)}</h3>
    ${pend?`<div class="verdict wait">⏳ Sent to your Guild Inspector. When they reply, tap the link in their email, or paste the code here:</div>
      <div class="codebox"><input type="text" id="codeIn" placeholder="GQ-XXXX-XXXXXX" autocomplete="off"><button class="gbtn sm" id="codeGo">Apply</button></div>
      <button class="gbtn plain sm" id="codePaste" style="width:100%">📋 Paste from clipboard</button>`:""}
    ${shotFor(q)?`<div class="shotreq"><b>📸 Show:</b> ${esc(shotFor(q))}</div>`:""}
    <p class="note" style="margin:0;text-align:center">${shotFor(q)?"":"Snap a photo of the finished job. "}Proof has to be taken live with the in-app camera.</p>
    <button class="filebtn" id="camBtn" type="button">📸 Open camera</button>
    <img class="preview" id="prev" alt="Your proof photo">
    <div id="verdict"></div>
    <div class="btns" id="checkBtns">
      ${aiOn?`<button class="gbtn" id="chkAI" disabled>🤖 Hand it to Lilia (AI check) · full reward</button>`:""}
      ${insOn?`<button class="gbtn blue" id="chkIns" disabled>🧐 Send to Guild Inspector · full reward</button>`:""}
      ${aiOn||insOn?"":`<p class="note" style="margin:0;text-align:center">Lilia needs someone to check your photo. Set up an AI checker or a Guild Inspector in Settings.</p>
        <button class="gbtn" data-act="goSettings" data-v="secAI">⚙️ Open Settings</button>`}
      <button class="gbtn plain" data-act="close">Back</button>
    </div>`);
  if(pend){
    $("codeGo").onclick = () => applyInspectorCode($("codeIn").value);
    $("codePaste").onclick = async () => { try{ const t = await navigator.clipboard.readText(); $("codeIn").value = (t.match(/GQ-[A-Z0-9]{4}-[A-Z0-9]{6}/i)||[t])[0]; applyInspectorCode($("codeIn").value); }catch(e){ toast("Couldn't read the clipboard. Paste the code into the box instead."); } };
  }
  let file = null;
  const btns = ["chkAI","chkIns"].map($).filter(Boolean);
  $("camBtn").onclick = async () => {
    const shot = await proofShot(shotFor(q) ? `For this one, show: ${shotFor(q)}.` : undefined);
    if(shot==="old"){ const v=$("verdict"); v.className="verdict no"; v.textContent="Lilia: That photo isn't fresh. Take a new one with the camera, please!"; return; }
    if(!shot || !$("prev")) return;
    file = shot;
    const p = $("prev"); p.src = URL.createObjectURL(file); p.style.display="block";
    $("camBtn").textContent = "📸 Retake photo";
    $("verdict").textContent = ""; $("verdict").className = "";
    btns.forEach(b=>b.disabled=false);
  };
  const fresh = () => true;
  const busy = (on, msg) => { btns.forEach(b=>b.disabled=on); const v=$("verdict"); if(on){ v.className="verdict wait"; v.textContent=msg; } };
  if($("chkAI")) $("chkAI").onclick = async () => {
    if(!file || !fresh()) return;
    busy(true, "Lilia is squinting at your photo…");
    const v = $("verdict");
    try{
      const img = await shrink(file);
      const prompt = `You are Lilia, the cheerful receptionist of an adventurers' guild in an anime fantasy world. An adventurer is handing in proof for a real-life chore quest.
Quest: "${q.title}"
The photo was taken live with the app's camera just now.
Approve only if the photo reasonably shows this task done or its finished result. Be fair: a clean sink and drying rack is fine for dishes, a made bed for "make the bed". Accept reasonable evidence for tasks that are hard to show fully.
Homes are lived in. Judge the task itself, the way a fair friend would, not whether the room looks like a showroom: things that normally live out (furniture, decor, a laptop on a desk, a blanket on the couch, toiletries by the sink, shoes by the door) are fine, and so is mess outside the task's scope. Only reject for leftover mess the task was clearly meant to deal with.
${shotFor(q)?`What this quest's photo must show: ${shotFor(q)}. Reject photos that don't show this.
`:""}Reject photos that would look exactly the same whether or not the task was done today (e.g. clothes sitting in a wardrobe for a laundry quest, a closed cupboard).
Reject photos of a screen, monitor, phone or printed picture (look for glare, pixels, bezels, moiré or paper edges), and clearly unrelated scenes.
Also check privacy: set "faces" to true if any real person's face is visible, even partly (including in a mirror). Areas painted over in solid black have been censored on purpose; that's fine.
Reply with JSON only: {"approved": true or false, "faces": true or false, "comment": "1-2 short sentences in character as Lilia, talking to the adventurer. If rejecting, say exactly what to fix."}`;
      const res = await AI.vision(prompt, img);
      const face = !!(res && res.faces === true);
      const lockedOut = face && privacy().strikes >= STRIKE_REJECT;   // 3+ strikes: face photos get rejected
      let ok = !!(res && res.approved === true) && !lockedOut;
      let comment = (res && typeof res.comment==="string" && res.comment) || (ok?"Looks good to me! Stamped.":"I can't approve this one. Try another photo?");
      if(face){ const n = addStrike();
        comment = lockedOut ? `There's a face in this photo, and you're on ${n} privacy strikes, so I can't accept it. Cover it with the ✏️ tool or retake without anyone in shot!`
          : `${comment} ⚠️ But I can see a face! That's privacy strike ${n}. Please keep faces out of proof photos.`; }
      v.className = "verdict " + (ok?"ok":"no");
      v.textContent = (ok?"✔ APPROVED! ":"✖ REJECTED. ") + comment;

      else busy(false);
    }catch(err){ busy(false); v.className = "verdict no"; v.textContent = err.message || "Something went wrong while checking. Try again in a moment."; }
  };
  if($("chkIns")) $("chkIns").onclick = async () => {

    try{

      const how = await sendToInspector(q, img);
      closeModal(); render();
      toast(how==="mailto" ? "Email draft opened. Attach the photo, then send it!" : how==="shared-copied" ? "📋 Paste your friend's email into To, then send!" : how==="email" ? "Email ready. Just press Send!" : "Sent! Waiting for your Guild Inspector.");
      say(`I've sent your proof to ${state.inspector.name || "your Guild Inspector"}. Tap their reply link when it comes in!`);
    }catch(err){ busy(false); if(err && err.name==="AbortError"){ $("verdict").textContent=""; $("verdict").className=""; return; } const v=$("verdict"); v.className="verdict no"; v.textContent="Couldn't open the share menu. Try again."; }
  };
}

function shrink(file){
  return new Promise((resolve,reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const max = 1024, s = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error("encode")), "image/jpeg", .82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("load")); };
    img.src = url;
  });
}

async function fetchBounties(btn){
  let list = [];
  if(AI.ready()){
    btn.disabled = true; btn.textContent = "Lilia is digging through the request pile…";

      const existing = state.quests.map(q=>q.title).join("; ");

For each: "title" (max 60 chars), "cat" one of physical, outside, social, study, household, selfcare, admin, creative (the thing that makes it hardest), "size" one of quick, medium, big, "proof" either "photo" (if the finished result can be photographed without any people, faces, mirrors or private info in shot) or "honour" (anything private, body-related, social, or with nothing to see), "flavour" one short in-character line from Lilia (max 90 chars).
Reply with JSON only: {"bounties":[{"title":"","cat":"","size":"","proof":"","flavour":""}]}`);
      list = (out && Array.isArray(out.bounties) ? out.bounties : []).slice(0,3)
        .filter(b => b && typeof b.title==="string" && b.title.trim())
        .map(b => ({id:uid(), bounty:true, title:b.title.trim().slice(0,80), rank:"D", cat:CATS[b.cat]?b.cat:"household", size:SIZES[b.size]?b.size:"quick",
                    proof:b.proof==="honour"?"honour":"photo", flavour:typeof b.flavour==="string"?b.flavour.slice(0,120):"", done:false}));
    }catch(err){ toast(err.message || "Couldn't reach the AI, so Lilia used the guild's request pile instead."); }
  }
  if(!list.length) list = offlineBounties();
  state.bounties = {date:dayKey(), list};
  save(); render(); toast("★ 3 new bounties pinned to the board!");
}

/* ---------- sparkle particles ---------- */
(function sparkles(){
  if(reduceMotion) return;
  const c = $("fx"), ctx = c.getContext("2d"); let W=0,H=0,dpr=1;
  const P = Array.from({length:34}, () => ({x:Math.random(), y:Math.random(), r:.6+Math.random()*1.8, s:.00015+Math.random()*.0004, a:Math.random()*6.28}));
  function size(){ dpr = Math.min(2, devicePixelRatio||1); W=c.clientWidth; H=c.clientHeight; c.width=W*dpr; c.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  size(); addEventListener("resize", size);
  (function frame(){
    ctx.clearRect(0,0,W,H);
    for(const p of P){
      p.y -= p.s; p.a += .03; if(p.y < -.02){ p.y = 1.02; p.x = Math.random(); }
      const al = .35 + .35*Math.sin(p.a);
      ctx.fillStyle = `rgba(255,226,150,${al})`; ctx.beginPath(); ctx.arc(p.x*W + Math.sin(p.a*.5)*6, p.y*H, p.r, 0, 6.29); ctx.fill();
    }
    requestAnimationFrame(frame);
  })();
})();

/* ---------- boot ---------- */
function withTimeout(p, ms){ return Promise.race([p, new Promise(r=>setTimeout(()=>r(null), ms))]); }
function normalise(s){
  const f = freshState();
  if(!s.rank){ const lv=levelInfo(s.xp||0).lvl; s.rank = ["E","D","C","B","A","S"].filter(r=>lv>=({E:5,D:10,C:20,B:35,A:50,S:65})[r]).pop() || "F"; }
  if(!Array.isArray(s.activeDays)) s.activeDays = [...new Set((s.log||[]).map(l=>l.date).filter(Boolean))];
  return { ...f, ...s, quests:Array.isArray(s.quests)?s.quests:f.quests, done:s.done||{}, active:s.active||{},
           bounties:s.bounties||{date:"",list:[]}, log:Array.isArray(s.log)?s.log:[], poolPerDay:s.poolPerDay||2, inspector:s.inspector||{}, pending:s.pending||{}, tut:s.tut||((s.hero&&s.hero.created)?{done:true}:undefined) };
}
